<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 | 챔로드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#533afd">
  <style>
    .input-field {
      width: 100%; padding: 0.625rem 0.875rem; border: 1.5px solid #e2e8f0;
      border-radius: 0.625rem; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .input-field.error { border-color: #ef4444; }
    .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem; display: none; }
    .error-msg.show { display: block; }
    .btn-primary {
      width: 100%; padding: 0.75rem; background: #1d4ed8; color: white;
      border-radius: 0.625rem; font-weight: 600; font-size: 0.95rem;
      transition: background 0.2s; cursor: pointer; border: none;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert-box { padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .alert-box.show { display: block; }
    .alert-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .pw-toggle { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; }
    .pw-toggle:hover { color: #475569; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,#1e40af,#3b82f6)">
          <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none">
            <path d="M2 18L10 5L18 18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="10" y1="8.5" x2="10" y2="11.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="10" y1="14" x2="10" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="font-bold text-slate-800 text-lg tracking-tight">챔로드</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-1">새 비밀번호 설정</h1>
        <p class="text-slate-500 text-sm">사용할 새 비밀번호를 입력해주세요</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">

        <!-- ── 입력 폼 ── -->
        <div id="form-panel">
          <div id="rp-alert" class="alert-box alert-error"></div>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">새 비밀번호 <span class="text-slate-400 font-normal text-xs">(8자 이상, 영문·숫자·특수문자 포함)</span></label>
              <div class="relative">
                <input id="rp-pw" type="password" class="input-field pr-10" placeholder="영문·숫자·특수문자 포함 8자 이상" autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw('rp-pw', this)" tabindex="-1">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
              <p id="rp-pw-err" class="error-msg">비밀번호는 8자 이상이어야 합니다.</p>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">새 비밀번호 확인</label>
              <div class="relative">
                <input id="rp-pw2" type="password" class="input-field pr-10" placeholder="비밀번호 재입력" autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw('rp-pw2', this)" tabindex="-1">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
              <p id="rp-pw2-err" class="error-msg">비밀번호가 일치하지 않습니다.</p>
            </div>

            <button class="btn-primary" id="rp-submit" onclick="doReset()">비밀번호 변경</button>
          </div>
        </div>

        <!-- ── 완료 상태 ── -->
        <div id="done-panel" class="hidden text-center py-2">
          <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
          <p class="text-base font-semibold text-slate-800 mb-2">비밀번호가 변경되었습니다</p>
          <p class="text-sm text-slate-500 leading-relaxed mb-5">보안을 위해 모든 기기에서 로그아웃되었습니다. 새 비밀번호로 다시 로그인해주세요.</p>
          <a href="login.html" class="btn-primary inline-block" style="text-decoration:none">로그인하러 가기</a>
        </div>

        <!-- ── 링크 오류 상태 ── -->
        <div id="invalid-panel" class="hidden text-center py-2">
          <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <p class="text-base font-semibold text-slate-800 mb-2">링크가 유효하지 않습니다</p>
          <p id="invalid-msg" class="text-sm text-slate-500 leading-relaxed mb-5">링크가 만료되었거나 이미 사용되었습니다. 재설정을 다시 요청해주세요.</p>
          <a href="find-account.html" class="btn-primary inline-block" style="text-decoration:none">재설정 다시 요청</a>
        </div>

      </div>
    </div>
  </main>

<script src="js/main.js"></script>
<script>
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  let _busy = false;

  // 토큰이 아예 없으면 바로 오류 화면
  if (!TOKEN) {
    document.getElementById('form-panel').classList.add('hidden');
    document.getElementById('invalid-panel').classList.remove('hidden');
    document.getElementById('invalid-msg').textContent = '유효하지 않은 접근입니다. 재설정 메일의 링크를 눌러 들어와주세요.';
  }

  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isHidden
      ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
      : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
  }

  function fieldError(fieldId, errId, msg) {
    const f = document.getElementById(fieldId);
    const e = document.getElementById(errId);
    if (msg) { f.classList.add('error'); e.textContent = msg; e.classList.add('show'); f.focus(); return true; }
    f.classList.remove('error'); e.classList.remove('show'); return false;
  }

  async function doReset() {
    document.getElementById('rp-alert').classList.remove('show');
    const pw  = document.getElementById('rp-pw').value;
    const pw2 = document.getElementById('rp-pw2').value;

    let hasErr = false;
    const pwErr = passwordError(pw);   // main.js 전역 — 서버와 동일 기준
    if (pwErr) { fieldError('rp-pw', 'rp-pw-err', pwErr); hasErr = true; } else fieldError('rp-pw', 'rp-pw-err', '');
    if (pw !== pw2) { fieldError('rp-pw2', 'rp-pw2-err', '비밀번호가 일치하지 않습니다.'); hasErr = true; } else fieldError('rp-pw2', 'rp-pw2-err', '');
    if (hasErr || _busy) return;

    _busy = true;
    const btn = document.getElementById('rp-submit');
    btn.disabled = true; btn.textContent = '변경 중...';
    const r = await Auth.resetPassword(TOKEN, pw);
    _busy = false;
    btn.disabled = false; btn.textContent = '비밀번호 변경';

    if (!r.ok) {
      // 토큰 만료·사용됨 → 오류 화면. 그 외(비번 정책 등) → 인라인 알림.
      const expired = /만료|사용|유효하지/.test(r.error || '');
      if (expired) {
        document.getElementById('form-panel').classList.add('hidden');
        document.getElementById('invalid-panel').classList.remove('hidden');
        document.getElementById('invalid-msg').textContent = r.error;
      } else {
        const el = document.getElementById('rp-alert');
        el.textContent = r.error || '변경에 실패했습니다.'; el.classList.add('show');
      }
      return;
    }

    document.getElementById('form-panel').classList.add('hidden');
    document.getElementById('done-panel').classList.remove('hidden');
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
</script>
</body>
</html>
