<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진단 결과 | 챔로드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#533afd">
</head>
<body class="bg-slate-50">

<div id="header-placeholder"></div>

<section class="bg-blue-700 text-white py-8">
  <div class="max-w-4xl mx-auto px-4 text-center">
    <h1 class="text-2xl md:text-3xl font-bold mb-1">채무진단 결과</h1>
    <p id="result-date" class="text-blue-200 text-sm"></p>
  </div>
</section>

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- ═══ 간단 결과 (첫 화면): 요건 확인 → 숫자 참고 → 위험 요약 → 다음 단계 ═══ -->

  <!-- 두 절차의 법정요건·추가 확인사항 요약 -->
  <div id="best-recommendation" class="mb-3"><!-- JS 렌더링 --></div>

  <!-- 한 줄 참고 고지 -->
  <p id="mini-disclaimer" class="text-sm text-slate-500 text-center mb-5 font-medium">본 결과는 입력값 기반 참고용 분석으로 법률상담이 아니며, 최종 판단은 법원 결정과 전문가 검토에 따라 달라질 수 있습니다.</p>

  <!-- 핵심 숫자 요약 -->
  <div id="key-numbers" class="mb-4"></div>

  <!-- 면책불허가 위험 요약 스트립 (누르면 상세) -->
  <div id="risk-strip" class="mb-4"></div>

  <!-- 다음 단계 CTA -->
  <div id="next-step-cta" class="mb-8"></div>

  <!-- ═══ 상세 결과 (접힌 아코디언 — 궁금한 사람만 펼쳐보기) ═══ -->
  <div id="detail-accordions" class="space-y-3"></div>

  <div class="text-center mt-6 text-sm">
    <a href="diagnosis.html" class="text-slate-500 hover:text-blue-700 underline">다시 진단하기</a>
  </div>

  <!-- 하단 고지 -->
  <div class="disclaimer-box mt-16 flex items-start gap-2">
    <span class="shrink-0">⚠️</span>
    <span>위 결과는 입력하신 정보를 바탕으로 한 참고용 분석입니다. 법률상담·법률대리·결과 보장이 아니며, 최종 판단은 법원 결정 및 전문가 검토에 따라 달라질 수 있습니다. 구체적인 법률 판단이 필요한 경우 변호사, 법무사, 대한법률구조공단(국번없이 132) 등 전문가 상담을 권장합니다.</span>
  </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast"></div>

<script src="js/main.js"></script>
<script>
  initPage('diagnosis');

  // ── 진행이 막히는 사유 반환 (있으면 {label, text}, 없으면 null) ──
  // ⚠️ 법적 성질을 구분한다. 개인회생의 5년 미경과는 제595조 제5호의 법정 기각사유이고,
  // 파산의 기간 미경과는 제564조 제1항 제4호의 면책불허가 사유다. 설문은 확정일을
  // 검증하지 못하므로 먼저 날짜를 확인하게 하고, 파산의 경우에만 제564조 제2항 재량면책을 안내한다.
  function getHardBlockReason(type, data) {
    const unsecured = data.unsecuredDebt    || 0;
    const secured   = data.securedDebt      || 0;
    const priors    = data.priorAdjustments || [];
    if (type === 'rehab') {
      if (priors.includes('rehab-done-recent'))
        return { label: '확정일 확인', text: '개인회생 면책 확정 후 5년 미경과는 채무자회생법 제595조 제5호의 법정 기각사유입니다. 설문 답변만으로 날짜를 검증할 수 없으므로 면책결정 확정일을 먼저 확인하세요.' };
      if (priors.includes('rehab-ongoing'))
        return { label: '진행상태 확인', text: '현재 개인회생 사건이 진행 중인 것으로 입력했습니다. 추가 신청의 필요·가능 여부를 현재 사건의 담당 법원 또는 전문가에게 확인하세요.' };
      if (unsecured > 1_000_000_000)
        return { label: '한도 확인', text: `입력한 무담보 채무(${formatWon(unsecured)})가 개인회생 법정 한도(10억)를 초과합니다. 채권 분류를 다시 확인하고 일반회생·파산·신용회복위원회 절차를 각각 검토하세요.` };
      if (secured   > 1_500_000_000)
        return { label: '한도 확인', text: `입력한 담보 채무(${formatWon(secured)})가 개인회생 법정 한도(15억)를 초과합니다. 채권 분류를 다시 확인하고 일반회생·파산·신용회복위원회 절차를 각각 검토하세요.` };
    }
    if (type === 'bankrupt') {
      if (priors.includes('bankrupt-done-recent'))
        return { label: '면책 위험', text: '파산 면책 확정 후 7년 미경과 — 면책불허가 사유(제564조 제1항 제4호 전단). 다만 법원은 파산에 이르게 된 경위 등을 고려해 재량으로 면책을 허가할 수 있습니다(같은 조 제2항).' };
      if (priors.includes('bankrupt-ongoing'))
        return { label: '진행상태 확인', text: '현재 개인파산 사건이 진행 중인 것으로 입력했습니다. 추가 신청의 필요·가능 여부를 현재 사건의 담당 법원 또는 전문가에게 확인하세요.' };
      // 제564조 제1항 제4호 후단 — 개인회생 면책(제624조)을 받은 뒤 5년이 지나지 않으면
      // 파산 면책도 불허가 사유다. 이 사람에게 "파산이 유일한 방법"이라고 안내하면 안 된다.
      if (priors.includes('rehab-done-recent'))
        return { label: '면책 위험', text: '개인회생 면책 확정 후 5년 미경과 — 파산 면책도 불허가 사유에 해당합니다(제564조 제1항 제4호 후단). 면책 확정일을 먼저 확인하시고, 법원은 재량으로 면책을 허가할 수도 있으므로(같은 조 제2항) 전문가 상담을 권합니다.' };
    }
    return null;
  }

  // ── 설문 데이터 기반 개인화 사유 생성 ──
  function buildReasons(data, type, hardBlocked = {}) {
    const pros = [], cons = [];
    const income      = data.monthlyIncome  || 0;
    // 변제 여력은 저장된 60% 참고 계산과 동일한 기준을 사용 — 배너·카드·상세 수치 불일치 방지
    const repayCalc   = Storage.load('diagnosis_repay') || {};
    const basicLiving = getStandardLiving(1 + (parseInt(data.dependents) || 0));
    const courtLiving = repayCalc.effectiveLiving || basicLiving;
    const disposable  = (repayCalc.monthly !== undefined) ? repayCalc.monthly : Math.max(0, income - basicLiving);
    const unsecured   = data.unsecuredDebt  || 0;
    const secured     = data.securedDebt    || 0;
    const totalDebt   = data.totalDebt      || 0;
    const totalAssets = data.totalAssets    || 0;
    const arrears     = data.arrearsMonths  || 0;
    const priors      = data.priorAdjustments || [];
    const causes      = data.debtCauses     || [];
    if (type === 'rehab') {
      // 입력에서 바로 확인되는 사실
      if (data.hasIncome && income > 0)
        pros.push(`정기소득 입력 있음 (월 ${formatWon(income)}) — 신청 시 계속적·반복적 소득인지 증빙 확인 필요`);
      if (disposable > 0)
        pros.push(`기준중위소득 60%만 공제한 월 잔여소득 ${formatWon(disposable)} → 36개월 명목합계 약 ${formatWon(disposable * 36)} (법원 인정 가용소득·현재가치 아님)`);
      if (unsecured > 0 && unsecured <= 1_000_000_000)
        pros.push(`무담보 채무 ${formatWon(unsecured)} — 법정 신청 한도(10억) 이내`);
      if (secured > 0 && secured <= 1_500_000_000)
        pros.push(`담보 채무 ${formatWon(secured)} — 법정 신청 한도(15억) 이내`);
      if (arrears > 0)
        pros.push('연체 중 — 중지·금지명령을 함께 신청할 수 있고, 법원이 명령한 범위 또는 제600조가 정한 개인회생채권의 집행 범위에서 중지될 수 있음');

      // 추가로 확인할 사항
      if (!data.hasIncome || income === 0)
        cons.push('현재 소득 입력 없음 — 개인회생의 계속적·반복적 수입 요건을 확인하기 어렵습니다. 파산·일반회생·채무조정 등 다른 경로도 별도로 확인하세요');
      else if (disposable <= 0)
        cons.push(`소득(${formatWon(income)})이 기준중위소득 60% 참고값(${formatWon(courtLiving)}) 이하 — 이 화면의 월 잔여소득은 0원이나, 법원 판단을 확정하는 값은 아닙니다`);
      if (unsecured > 1_000_000_000)
        cons.push(`무담보 채무(${formatWon(unsecured)})가 개인회생 법정 한도(10억)를 초과한 것으로 입력됨 — 채권 분류 확인 후 일반회생 등 다른 절차 검토 필요`);
      if (secured > 1_500_000_000)
        cons.push(`담보 채무(${formatWon(secured)})가 개인회생 법정 한도(15억)를 초과한 것으로 입력됨 — 채권 분류 확인 후 일반회생 등 다른 절차 검토 필요`);
      if (priors.includes('rehab-done-recent'))
        cons.push('개인회생 면책 확정 후 5년 미경과 — 신청 기각 사유에 해당합니다(채무자회생법 제595조 제5호)');
      if (priors.includes('rehab-ongoing'))
        cons.push('현재 개인회생 사건이 진행 중으로 입력됨 — 추가 신청의 필요·가능 여부를 현재 사건의 담당 법원에 확인');
      if (priors.includes('bankrupt-done-recent'))
        cons.push('파산 면책 이력 있음 — 면책 확정 후 5년이 지나지 않았다면 개인회생 신청도 기각 사유(채무자회생법 제595조 제5호)에 해당합니다. 면책 확정일을 먼저 확인하세요');
      if (data.recentLoan === 'within-3m')
        cons.push('최근 3개월 이내 신규 대출 있음 — 최근 대출 자체가 곧 불허가 사유는 아닙니다. 대출 당시 지급불능 인식·설명 내용·상환의사와 사용처를 확인할 자료를 준비하세요');
      else if (data.recentLoan === 'within-1y')
        cons.push('최근 1년 이내 신규 대출 있음 — 채무 발생 경위 심사에서 대출 시점과 사용처에 대한 소명이 필요할 수 있습니다');
    }

    if (type === 'bankrupt') {
      // 입력에서 바로 확인되는 사실
      // 채무 규모 초과는 파산 적합성 판정이 아니라 다른 법원 절차도 확인할 사유다.
      // 개인회생 면책 후 5년 미경과는 파산 면책도 불허가 사유(제564조 1항 4호 후단)라 유리할 게 없다.
      if (hardBlocked.rehab && !priors.includes('rehab-done-recent') && !priors.includes('rehab-ongoing'))
        pros.push(`개인회생 법정 한도 초과 입력 — 채권 분류를 확인한 뒤 일반회생·파산 등 다른 법원 절차도 별도 검토 필요`);
      if (!data.hasIncome || income === 0)
        pros.push('현재 소득 입력 없음 — 지급불능 판단에서 고려되는 한 요소이며 재산·근로능력·채무 상태를 함께 심사');
      else if (income < courtLiving)
        pros.push(`소득(${formatWon(income)})이 60% 기준생계비(${formatWon(courtLiving)})에 미달 — 지급불능 여부를 판단할 때 확인할 요소`);
      if (totalDebt > 0 && totalAssets < totalDebt)
        pros.push(`입력 재산(${formatWon(totalAssets)})이 입력 채무(${formatWon(totalDebt)})보다 적음 — 실제 환가가치·소득·지출을 함께 확인해야 함`);
      if (arrears >= 18)
        pros.push('장기 연체 입력 있음 — 지급불능 판단의 한 자료일 뿐, 연체기간만으로 법정 요건이 확정되지는 않음');

      // 추가로 확인할 사항
      if (data.hasIncome && disposable > 0 && !hardBlocked.rehab)
        cons.push(`60% 기준 월 잔여소득이 ${formatWon(disposable)}으로 계산됨 — 파산의 지급불능 여부와 개인회생의 계속적 수입·변제 가능성을 각각 확인해야 하며, 어느 절차가 더 적합한지는 이 값만으로 판단할 수 없음`);
      if (data.hasIncome && income > 0)
        cons.push(`소득(월 ${formatWon(income)})이 있는 경우에도 지급불능 여부는 재산·부채·수입·지출과 계속 변제할 가능성을 종합해 판단합니다 — 이 입력만으로 결론 내리지 말고 관련 증빙을 함께 확인하세요`);
      if (priors.includes('rehab-done-recent'))
        cons.push('개인회생 면책 확정 후 5년 미경과 — <strong>파산 면책도 불허가 사유</strong>에 해당합니다(채무자회생법 제564조 제1항 제4호 후단). 면책 후 채무가 재발생한 경위도 법원에 소명해야 합니다');
      if (causes.includes('gambling'))
        cons.push('도박·사행행위 관련 채무가 있다는 사실만으로 자동 불허되는 것은 아닙니다 — 그 행위로 재산을 현저히 감소시키거나 과대한 채무를 부담했는지 제564조 제1항 제6호 요건을 사실·자료로 확인해야 합니다');
      if (causes.includes('investment'))
        cons.push('투자 손실 채무 포함 — 투자 경위가 과다한 낭비·도박·사행행위에 해당해 재산을 현저히 감소시키거나 과대한 채무를 부담한 경우인지 제564조 제1항 제6호 요건별 확인이 필요합니다');
      if (data.recentLoan === 'within-3m' || data.recentLoan === 'within-1y')
        cons.push('최근 1년 이내 신규 대출 있음 — 최근 대출 자체가 곧 불허가 사유는 아닙니다. 파산원인 사실을 숨기고 신용거래로 재산을 취득했는지 등 제564조 제1항 제2호의 구체적 요건과 사용처를 확인합니다');
      if (totalAssets >= 5_000_000)
        cons.push(`보유 재산(${formatWon(totalAssets)}) — 일정 한도 초과분은 파산재단에 편입되어 처분될 수 있습니다. 재산 목록을 정확히 신고해야 합니다`);
      if (!causes.includes('gambling'))
        cons.push('낭비·사치성 소비, 허위 재산신고 등도 면책불허가 사유(채무자회생법 제564조)에 해당할 수 있습니다 — 채무 발생 경위를 정확히 정리하세요');
      if (priors.includes('bankrupt-done-recent'))
        cons.push('파산 면책 확정 후 7년 미경과 — 면책불허가 사유에 해당합니다(채무자회생법 제564조 제1항 제4호 전단). 다만 법원은 파산에 이르게 된 경위 등을 고려해 재량으로 면책을 허가할 수 있습니다(같은 조 제2항)');
      if (priors.includes('bankrupt-denied'))
        cons.push('이전 면책불허가 결정 이력 있음 — 이전 결정문에서 실제 불허가 사유가 무엇이었는지, 현재도 그 사유가 남아 있는지 먼저 확인해야 합니다');
      if (priors.includes('bankrupt-ongoing'))
        cons.push('현재 개인파산 사건이 진행 중으로 입력됨 — 추가 신청의 필요·가능 여부를 현재 사건의 담당 법원에 확인');
    }

    return { pros, cons };
  }

  // ── 절차별 확인 카드 ──
  function buildCard(title, type, data, hardBlocked = {}) {
    const { pros, cons } = buildReasons(data, type, hardBlocked);
    const icons = { rehab:'📋', bankrupt:'⚖️' };
    const blockReason = getHardBlockReason(type, data);

    // 진행이 막히는 사유 카드
    if (hardBlocked[type] && blockReason) {
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-5 flex flex-col">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-start gap-2 font-bold text-slate-800 text-base">
              <span class="shrink-0">${icons[type]}</span><span>${title}</span>
            </div>
            <div class="shrink-0 ml-3 bg-red-50 border border-red-200 rounded-lg px-3 py-1.5 text-center">
              <div class="text-sm font-extrabold text-red-600 leading-none">${blockReason.label}</div>
            </div>
          </div>
          <div class="bg-red-50 border border-red-100 rounded-lg px-3 py-2.5 text-xs text-red-700 leading-relaxed">
            <span class="font-semibold">사유:</span> ${blockReason.text}
          </div>
        </div>`;
    }

    const prosHtml = pros.slice(0, 3).map(p =>
      `<li class="flex gap-2 text-xs text-slate-600 leading-snug">
         <span class="text-blue-500 shrink-0 font-bold mt-0.5">•</span><span>${p}</span>
       </li>`).join('');

    const consHtml = cons.slice(0, 5).map(c =>
      `<li class="flex gap-2 text-xs text-slate-600 leading-snug">
         <span class="text-amber-500 shrink-0 font-bold mt-0.5">?</span><span>${c}</span>
       </li>`).join('');

    return `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col">
        <div class="flex items-start justify-between mb-1">
          <div class="flex items-start gap-2 font-bold text-slate-800 text-base">
            <span class="shrink-0">${icons[type]}</span>
            <span>${title}</span>
          </div>
          <div class="text-right shrink-0 ml-3">
            <div class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5">법정요건 별도 확인</div>
          </div>
        </div>
        ${pros.length ? `
        <div class="mb-3">
          <p class="text-xs font-semibold text-blue-700 mb-1.5">입력에서 확인된 사실</p>
          <ul class="space-y-1.5">${prosHtml}</ul>
        </div>` : ''}
        ${cons.length ? `
        <div class="${pros.length ? 'mt-3 pt-3 border-t border-slate-100' : ''}">
          <p class="text-xs font-semibold text-amber-700 mb-1.5">추가 확인할 사항</p>
          <ul class="space-y-1.5">${consHtml}</ul>
        </div>` : ''}
      </div>`;
  }

  // ── 중립적 결과 배너: 점수·승자·백분율 없이 두 절차를 함께 확인하게 한다 ──
  function buildBanner(data, hardBlocked = {}) {
    if (hardBlocked.rehab && hardBlocked.bankrupt) {
      return `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
        <p class="text-red-700 font-bold text-base mb-1">현재 진행 중인 사건 또는 입력한 한도를 먼저 확인하세요</p>
        <p class="text-slate-500 text-sm">이 화면은 신청 가능 여부를 확정하지 않습니다. 사건 상태와 채권 분류를 관할 법원 또는 전문가에게 확인하세요.</p>
      </div>`;
    }
    return `
      <div class="bg-gradient-to-r from-blue-700 to-blue-500 text-white rounded-2xl p-6">
        <div class="flex items-center gap-2 text-blue-200 text-sm font-semibold mb-2">
          <span>🧭</span> 입력값을 바탕으로 확인할 항목을 정리했습니다
        </div>
        <h2 class="text-xl font-extrabold">개인회생과 개인파산의 법정요건을 각각 확인하세요</h2>
        <p class="text-blue-100 text-sm mt-2">이 결과는 적합도·성공확률 또는 절차 추천이 아닙니다. 아래 카드에서 입력 사실과 빠진 판단요소를 확인한 뒤 공식 안내나 상담으로 최종 선택하세요.</p>
      </div>`;
  }

  // ── 접이식 섹션 셸 (상세 정보 아코디언 공통) ──
  function accordionShell(id, title, contentHtml, open = false) {
    return `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <button onclick="toggleSection('${id}')" class="w-full flex items-center justify-between gap-2 px-5 py-4 text-left hover:bg-slate-50 transition-colors">
          <span class="text-sm font-semibold text-slate-700">${title}</span>
          <span id="${id}-chev" class="acc-chev text-slate-400 text-xs shrink-0">${open ? '접기 ▲' : '펼치기 ▼'}</span>
        </button>
        <div id="${id}-body" class="acc-body ${open ? '' : 'hidden'} px-5 pb-5">${contentHtml}</div>
      </div>`;
  }

  function toggleSection(id) {
    const b = document.getElementById(id + '-body');
    const c = document.getElementById(id + '-chev');
    if (!b) return;
    b.classList.toggle('hidden');
    if (c) c.textContent = b.classList.contains('hidden') ? '펼치기 ▼' : '접기 ▲';
  }

  // ── 핵심 숫자 요약 (첫 화면) ──
  function buildKeyNumbers(data, repay) {
    const cell = (label, value, sub) => `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 text-center">
        <div class="text-xs text-slate-500 mb-1">${label}</div>
        <div class="text-xl font-bold text-blue-700">${value}</div>
        ${sub ? `<div class="text-xs text-slate-400 mt-1">${sub}</div>` : ''}
      </div>`;

    // 소득을 입력한 경우에만 60% 기준의 기계적 참고값을 보여 준다. 절차 추천은 아니다.
    if (data.hasIncome && repay && typeof repay.monthly === 'number') {
      const monthly = repay.monthly;
      const total36 = repay.total36 || 0;
      const zeroNote = monthly === 0 ? `
        <div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3">
          <span class="shrink-0">⚠️</span>
          <p class="text-xs text-slate-600">60% 기준 월 잔여소득이 0원입니다. 이 값만으로 개인회생 불가나 개인파산 적합성을 확정할 수 없으므로 소득 종류·근로능력·재산·채무 상태를 함께 확인하세요.</p>
        </div>` : '';
      // 무료 진단은 퇴직급여 제도·예상액을 묻지 않는다. 퇴직금채권·퇴직연금 수급권 등
      // 종류별 보호 범위가 달라 일률적인 비율을 자동 가산하지 않고 확인 경고만 표시한다.
      const employed = data.hasIncome && /^employed/.test(data.incomeType || '');
      const liqNote = (data.totalAssets || 0) > total36 ? `
        <p class="text-xs text-amber-600 mt-2 text-center">※ 입력 재산 합계가 36개월 명목 납부합계보다 큽니다. 이 비교만으로 인가 여부를 판정할 수 없으며, 정확한 청산가치와 인가시점 현재가치를 공식 양식으로 확인해야 합니다.</p>`
        : (employed && total36 > 0) ? `
        <div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3">
          <span class="shrink-0">⚖️</span>
          <p class="text-xs text-slate-600"><strong class="text-amber-800">재직 중이면 퇴직급여의 종류와 예상액을 확인하세요.</strong>
            일반 퇴직금·법정 퇴직연금·공무원 퇴직급여 등은 보호 범위가 서로 달라 일률적으로 절반을 재산에 더할 수 없습니다. 회사 또는 연금기관의 예상액 자료를 준비하고 법원 양식 기준으로 반영하세요.</p>
        </div>` : '';
      return `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          ${cell('60% 기준 월 잔여소득', formatWon(monthly), '법원 인정 가용소득 아님')}
          ${cell('36개월 명목 납부합계', formatWon(total36),
            (data.totalDebt > 0 && total36 >= 0)
              ? '현재가치 할인 전 단순 곱셈값'
              : '현재가치 할인 전 단순 곱셈값')}
          ${cell('입력 재산 합계', formatWon(data.totalAssets || 0), '청산가치 산정의 기초')}
        </div>
        <p class="text-xs text-slate-500 mt-2 text-center">※ 입력한 가구원 수를 그대로 인정한 것이 아니며, 실제 지출 초과분도 자동 공제하지 않았습니다. 법원이 인정하는 부양가족·생계비와 인가시점 현재가치에 따라 제출용 금액은 달라집니다.</p>${zeroNote}${liqNote}`;
    }

    // 소득 숫자 참고를 만들 수 없는 경우에는 입력 정보만 요약한다.
    return `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        ${cell('총 채무', formatWon(data.totalDebt || 0), '면책 범위는 법원이 결정')}
        ${cell('신고 재산 합계', formatWon(data.totalAssets || 0), '파산재단 산정의 기초')}
        ${cell('채권자 수', (data.creditorCount || 0) + '곳', '채권자 목록 작성 대상')}
      </div>`;
  }

  // ── 면책불허가 위험 요인 수집 ──
  function getDischargeRisks(data) {
    const causes     = data.debtCauses       || [];
    const priors     = data.priorAdjustments || [];
    const recentLoan = data.recentLoan       || 'none';

    const risks = [];
    if (causes.includes('gambling'))
      risks.push({ label: '도박·사행성 채무', detail: '입력 사실만으로 면책불허가 사유 해당 여부가 확정되지는 않습니다. 도박·사행행위로 재산을 현저히 감소시키거나 과대한 채무를 부담했는지 구체적 경위와 자료를 확인해야 하며, 법 제564조 제2항의 재량면책 심리도 별개입니다.', law: '채무자회생법 제564조 제1항 제6호·제2항' });
    if (causes.includes('investment'))
      risks.push({ label: '투자 손실', detail: '투자 손실이라는 명칭만으로 확정하지 않습니다. 구체적 행위가 과다한 낭비·도박·사행행위에 해당하고 그로 인해 재산이 현저히 줄거나 과대한 채무를 부담했는지 요건별로 확인해야 합니다.', law: '채무자회생법 제564조 제1항 제6호' });
    if (recentLoan === 'within-3m')
      risks.push({ label: '최근 3개월 이내 신규 대출', detail: '최근 대출 자체가 곧 불허가 사유는 아닙니다. 파산원인 사실을 숨기고 신용거래로 재산을 취득했는지, 당시 설명과 사용처가 무엇인지 확인합니다.', law: '채무자회생법 제564조 제1항 제2호' });
    else if (recentLoan === 'within-1y')
      risks.push({ label: '1년 이내 신규 대출', detail: '시점만으로 불허가가 되지는 않습니다. 파산원인 사실을 숨긴 신용거래인지와 대출 사용처·상환내역을 확인할 수 있습니다.', law: '채무자회생법 제564조 제1항 제2호' });
    if (priors.includes('bankrupt-denied'))
      risks.push({ label: '이전 면책불허가 이력', detail: '이전 결정문을 확인해 실제 불허가 사유와 현재도 남아 있는 사정을 구분하세요. 이전 불허가 이력만으로 이번 결과를 자동 예측할 수 없습니다.', law: '이전 결정문·현재 사실 확인 필요' });

    return risks;
  }

  // ── 위험 요약 스트립 (첫 화면) — 누르면 상세가 펼쳐짐 ──
  function buildRiskStrip(data) {
    const risks = getDischargeRisks(data);
    if (risks.length === 0) return '';
    const labels = risks.map(r => r.label).join(' · ');
    return `
      <div class="bg-red-50 border border-red-200 rounded-2xl overflow-hidden">
        <button onclick="toggleSection('risk-sec')" class="w-full flex items-center justify-between gap-2 px-5 py-4 text-left hover:bg-red-100 transition-colors">
          <span class="text-sm font-bold text-red-700">🚨 진행 전 확인할 위험 ${risks.length}건 — ${labels}</span>
          <span id="risk-sec-chev" class="acc-chev text-red-400 text-xs shrink-0">펼치기 ▼</span>
        </button>
        <div id="risk-sec-body" class="acc-body hidden px-5 pb-5">${buildRiskDetail(risks)}</div>
      </div>`;
  }

  // ── 위험 상세 본문 ──
  function buildRiskDetail(risks) {
    const procedureNote = `<div class="mt-4 pt-4 border-t border-red-200">
      <p class="text-xs text-slate-600">파산의 면책불허가 사유 목록이 개인회생에 그대로 적용되는 것은 아닙니다. 개인회생은 계속적·반복적 수입과 변제계획 인가요건을 별도로 확인해야 합니다. 이 입력만으로 이용 가능한 절차를 확정할 수 없으므로 법원 공식 안내 또는 <strong>대한법률구조공단(132)</strong>에서 두 절차를 각각 확인하세요.</p>
    </div>`;

    return `
      <p class="text-sm text-red-700 mt-1 mb-4">채무 발생 원인 중 <strong>면책불허가 사유</strong>에 해당할 수 있는 항목이 확인됩니다. 이 경우 파산선고는 받아도 면책은 거부될 수 있습니다.</p>

      <div class="space-y-2.5 mb-4">
        ${risks.map(r => `
          <div class="flex gap-2.5 bg-white border border-red-100 rounded-xl px-4 py-3">
            <span class="text-red-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">${r.label}</p>
              <p class="text-xs text-slate-500 mt-0.5">${r.detail}</p>
              <p class="text-xs text-red-400 mt-0.5">근거: ${r.law}</p>
            </div>
          </div>`).join('')}
      </div>

      <div class="bg-red-100 border border-red-200 rounded-xl p-4">
        <p class="text-sm font-bold text-red-800 mb-2">면책불허가가 확정되면 어떻게 되나요?</p>
        <ul class="space-y-1.5 text-xs text-slate-700">
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>책임이 면제되지 않음</strong> — 해당 면책결정으로는 법정 예외를 제외한 기존 채무에 대한 책임이 면제되지 않습니다. 개인회생·채무조정·불복 등 다른 경로는 별도로 검토할 수 있습니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>파산자 신분 지속</strong> — 복권되지 않아 공직·일부 자격 취득 제한 등 불이익이 계속됩니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>불복은 즉시항고로</strong> — 불허가 결정에 불복하려면 정해진 기간 내에 즉시항고를 제기해 다퉈야 합니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>후속 절차 확인</strong> — 같은 사건의 재신청 여부와 다른 채무조정 수단은 결정 확정 여부·불허가 사유에 따라 달라지므로 개별 확인이 필요합니다.</span></li>
        </ul>
        <p class="text-xs text-red-700 font-semibold mt-3">→ 기간이 짧은 불복 절차와 다른 채무조정 수단을 놓치지 않도록 결정문을 받은 즉시 확인하세요.</p>
      </div>

      ${procedureNote}`;
  }

  // ── 절차 선택 도우미: 점수 근접할 때 개인화 비교 ──
  function buildTossupAdvice() {
    return `<div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
      <p class="font-bold text-slate-800 text-sm mb-1">두 절차는 서로 다른 법정요건을 심사합니다</p>
      <p class="text-xs text-slate-600 leading-relaxed">이 설문은 지급불능, 계속적·반복적 수입, 정확한 청산가치, 면책불허가 사유를 모두 확인하지 못하므로 어느 절차가 더 유리한지 판단하지 않습니다. 개인회생·개인파산 카드의 확인사항을 각각 검토하고, 경계 사례는 법원 공식 안내 또는 대한법률구조공단(132)에서 확인하세요.</p>
    </div>`;
  }

  // ── 파산관재인·예납금 안내 (파산 검토 대상이면 재산 규모와 무관하게 표시) ──
  function buildTrusteeWarning(data) {
    const totalAssets = data.totalAssets || 0;
    const hasAssets = totalAssets >= 5_000_000;

    return `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5">
        <div class="flex items-start gap-3 mb-3">
          <span class="text-2xl shrink-0">⚠️</span>
          <div>
            <h3 class="font-bold text-amber-800 text-base mb-1">파산관재인 선임과 예납금 — 미리 준비하세요</h3>
            <p class="text-sm text-slate-600">법원은 사건의 재산·채무·조사 필요성 등에 따라 <strong>파산관재인</strong>을 선임할 수 있습니다. 파산재단으로 절차비용을 충당하기 부족하면 관재인 선임 없이 <em>동시폐지</em>로 진행될 수도 있으므로, 이 입력만으로 선임 여부를 예측하지 말고 접수 법원의 명령을 확인하세요.${hasAssets ? ` 입력하신 재산 합계(<strong>${formatWon(totalAssets)}</strong>)도 법원이 실제 환가 대상과 면제재산 여부를 별도로 심사합니다.` : ''}</p>
          </div>
        </div>

        <div class="space-y-2.5 mb-4">
          <div class="flex gap-2.5 bg-white border border-amber-100 rounded-xl px-4 py-3">
            <span class="text-amber-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">파산관재인 선임 → 예납금 납부 필요</p>
              <p class="text-xs text-slate-500 mt-0.5">법원은 파산관재인 보수 등 절차비용을 위해 <strong>예납명령</strong>을 내립니다. 서울회생법원 기준 원칙 <strong>30만원</strong>이며 사건에 따라 증액될 수 있습니다(법원별로 다를 수 있음). 예납금을 납부하지 못하면 파산신청이 기각될 수 있습니다.</p>
            </div>
          </div>
          <div class="flex gap-2.5 bg-white border border-blue-100 rounded-xl px-4 py-3">
            <span class="text-blue-400 shrink-0 font-bold mt-0.5">i</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">예납금이 부담된다면 — 소송구조 신청 가능</p>
              <p class="text-xs text-slate-500 mt-0.5">소송비용 납부 능력이 없는 경우 법원에 <strong>소송구조</strong>를 신청하면 예납금 납부를 면제·유예받을 수 있습니다. 법원이 직권으로 결정하기도 합니다.</p>
            </div>
          </div>
          <div class="flex gap-2.5 bg-white border border-amber-100 rounded-xl px-4 py-3">
            <span class="text-amber-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">챔로드 서비스 범위 안내</p>
              <p class="text-xs text-slate-500 mt-0.5">챔로드는 서류 준비부터 면책신청까지의 일반 절차를 기준으로 안내합니다. 파산관재인 선임 후의 구체적 대응(면담, 재산 환가 등)은 사건마다 달라, 관재인·법원 안내를 따르고 필요 시 전문가 확인을 권장합니다.</p>
            </div>
          </div>
        </div>

        <div class="bg-amber-100 border border-amber-200 rounded-xl p-4">
          <p class="text-sm font-bold text-amber-800 mb-1">신청 전 전문가 상담을 먼저 받아보세요</p>
          <p class="text-xs text-slate-600">${hasAssets ? '재산이 있는 상황에서의 개인파산은 절차가 더 복잡합니다. ' : ''}<strong>대한법률구조공단(132)</strong>의 무료 상담이나 법무사·변호사 상담을 통해 실제 예납금 규모와 절차를 먼저 확인하세요.</p>
        </div>
      </div>`;
  }

  // ── 메인 렌더링 ──
  function renderResults() {
    // 진단을 완료하지 않고 직접 접근한 경우 — 허위 카드 대신 진단 안내 표시
    const data = Storage.load('diagnosis_data');
    if (!data) {
      document.getElementById('best-recommendation').innerHTML = `
        <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center">
          <p class="text-slate-700 font-bold text-base mb-1">아직 진단 결과가 없습니다</p>
          <p class="text-slate-500 text-sm mb-4">무료 채무진단을 완료하면 이 페이지에서 결과를 확인할 수 있습니다.</p>
          <a href="diagnosis.html" class="inline-block bg-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-blue-800 transition-colors">무료 채무진단 시작하기</a>
        </div>`;
      const mini = document.getElementById('mini-disclaimer');
      if (mini) mini.style.display = 'none';
      return;
    }
    const repay     = Storage.load('diagnosis_repay')  || {};
    const date      = Storage.load('diagnosis_date')   || '';

    // 하드블록은 진행 중인 동일 절차와 개인회생 채무한도처럼 명백한 제한에만 쓴다.
    const priors = data.priorAdjustments || [];
    const hardBlocked = {
      rehab:    priors.includes('rehab-ongoing') || (data.unsecuredDebt || 0) > 1_000_000_000 || (data.securedDebt || 0) > 1_500_000_000,
      bankrupt: priors.includes('bankrupt-ongoing'),
    };

    document.getElementById('result-date').textContent = date ? '진단일: ' + date : '';

    // ── 간단 결과 (첫 화면) ──
    document.getElementById('best-recommendation').innerHTML = buildBanner(data, hardBlocked);

    // 핵심 숫자 요약 + 위험 요약 스트립
    document.getElementById('key-numbers').innerHTML = buildKeyNumbers(data, repay);
    document.getElementById('risk-strip').innerHTML  = buildRiskStrip(data);

    // ── 개인회생 숫자 참고 (소득 입력과 참고 계산이 있을 때만; 적합도 의미 없음) ──
    let repayDetailHtml = '';
    if (data.hasIncome && typeof repay.monthly === 'number') {
      const monthlyDisp = repay.monthly || 0;
      const total36     = repay.total36 || 0;
      repayDetailHtml = `<div class="pt-3">
        <h3 class="font-bold text-slate-800 text-lg mb-1">📋 개인회생 60% 기준 숫자 참고</h3>
        <p class="text-slate-500 text-sm mb-4">기준중위소득 60%만 공제하고 36개월을 곱한 기계적 참고값입니다. 법원이 인정한 가용소득·인가시점 현재가치 또는 면책액이 아닙니다.</p>

        ${monthlyDisp === 0 ? `
        <!-- 월 변제 0원 경고 -->
        <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4">
          <span class="text-xl shrink-0 mt-0.5">⚠️</span>
          <div>
            <p class="font-bold text-amber-800 text-sm mb-1">60% 기준 잔여소득이 0원입니다</p>
            <p class="text-xs text-slate-600">현재 입력만으로는 개인회생의 계속적·반복적 수입과 변제계획 이행 가능성을 확인하기 어렵습니다. 이것만으로 파산 적합성도 확정되지 않으므로 소득 종류·근로능력·재산·채무 상태를 함께 확인하세요.</p>
          </div>
        </div>` : ''}

        <!-- 계산 근거 -->
        <div class="bg-blue-50 border border-blue-100 rounded-xl mb-4 overflow-hidden">
          <button onclick="var b=this.nextElementSibling;b.classList.toggle('hidden');this.querySelector('.calc-chev').textContent=b.classList.contains('hidden')?'펼치기 ▼':'접기 ▲';" class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-blue-100 transition-colors">
            <span class="text-xs font-semibold text-blue-700">📐 계산 방식 및 적용 기준</span>
            <span class="calc-chev text-blue-400 text-xs">펼치기 ▼</span>
          </button>
          <div class="px-4 pb-4 hidden">
            <div class="space-y-1.5 text-xs text-slate-600">
            <div class="flex items-start gap-2">
              <span class="text-blue-400 mt-0.5 shrink-0">①</span>
              <span><strong class="text-slate-700">기본 생계비 참고값</strong> = 2026년 기준중위소득(보건복지부 고시) × 60% <span class="text-slate-500">(법원 실무의 출발점이며 확정 인정액 아님)</span></span>
            </div>
            <div class="flex items-start gap-2">
              <span class="text-blue-400 mt-0.5 shrink-0">②</span>
              <span><strong class="text-slate-700">이 화면의 공제액</strong> = 위 60% 참고값만 적용 <span class="text-slate-500">(입력한 실제 지출의 초과분은 자동 인정하지 않으며, 법원이 증빙과 개별 사정을 심사)</span></span>
            </div>
            <div class="flex items-start gap-2">
              <span class="text-blue-400 mt-0.5 shrink-0">③</span>
              <span><strong class="text-slate-700">60% 기준 월 잔여소득</strong> = 월 소득 − 60% 참고값 <span class="text-slate-500">(제출용 가용소득과 다를 수 있음)</span></span>
            </div>
            <div class="flex items-start gap-2">
              <span class="text-blue-400 mt-0.5 shrink-0">④</span>
              <span><strong class="text-slate-700">36개월 명목 납부합계</strong> = 월 잔여소득 × 36개월 <span class="text-slate-500">(3년은 법정 최단기간이 아니며 현재가치 할인 전 금액)</span></span>
            </div>
          </div>
          <div class="mt-3 pt-2.5 border-t border-blue-200 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
            <span>가구원 수: <strong class="text-slate-700">${repay.householdSize || 1}인</strong></span>
            <span>표준생계비(기준중위소득 60%): <strong class="text-slate-700">${formatWon(repay.standardLiving || 0)}</strong></span>
            <span>이 화면의 공제액: <strong class="text-slate-700">${formatWon(repay.standardLiving || 0)}</strong> <span class="text-blue-600">(60% 참고값)</span></span>
          </div>
          </div>
        </div>

        <!-- 결과 카드 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
          <div class="bg-blue-50 rounded-xl p-4 text-center">
            <div class="text-xs text-slate-500 mb-1">60% 기준 월 잔여소득</div>
            <div class="text-xl font-bold text-blue-700">${formatWon(monthlyDisp)}</div>
            <div class="text-xs text-slate-400 mt-1">법원 인정 가용소득 아님</div>
          </div>
          <div class="bg-blue-50 rounded-xl p-4 text-center">
            <div class="text-xs text-slate-500 mb-1">36개월 명목 납부합계</div>
            <div class="text-xl font-bold text-blue-700">${formatWon(total36)}</div>
            <div class="text-xs text-slate-400 mt-1">현재가치 할인 전</div>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 text-center">
            <div class="text-xs text-slate-500 mb-1">입력 재산 합계</div>
            <div class="text-xl font-bold text-slate-700">${formatWon(data.totalAssets || 0)}</div>
            <div class="text-xs text-slate-400 mt-1">청산가치 산정의 기초</div>
          </div>
        </div>

        <!-- 청산가치 보장 경고 (재산 > 3년 변제총액) -->
        ${(data.totalAssets || 0) > total36 ? `
        <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4">
          <span class="text-xl shrink-0 mt-0.5">⚖️</span>
          <div>
            <p class="font-bold text-amber-800 text-sm mb-1">현재가치·청산가치 별도 확인 필요</p>
            <p class="text-xs text-slate-600">입력 재산 합계(<strong>${formatWon(data.totalAssets || 0)}</strong>)가 36개월 명목 납부합계(${formatWon(total36)})보다 큽니다. 이 화면은 면제재산·담보·환가비용을 반영한 청산가치와 인가시점 현재가치를 계산하지 않으므로 인가 여부를 판정하지 않습니다. 법원 공식 변제계획안 또는 회생위원 안내로 확인하세요.</p>
          </div>
        </div>` : ''}

        <!-- 법적 근거 및 주의사항 -->
        <div class="disclaimer-box">
          <p class="font-medium text-slate-700 mb-1">⚖️ 법적 근거</p>
          <ul class="space-y-0.5 text-xs text-slate-500 mb-2">
            <li>· 채무자 회생 및 파산에 관한 법률 제579조 제4호 (가용소득 — 소득에서 생계비 등을 공제한 금액)</li>
            <li>· 채무자 회생 및 파산에 관한 법률 제614조 (변제계획의 인부 — 청산가치 보장 등 인가 요건)</li>
            <li>· 보건복지부 고시 — 2026년 기준중위소득 (가구원 수별 표준생계비 산정 기준)</li>
            <li>· 법원 실무 — 기준중위소득 60%를 생계비 검토의 출발점으로 참고하고 개별 사정·증빙을 함께 확인</li>
          </ul>
          <p class="text-xs text-slate-500">위 금액은 60% 기준의 <strong class="text-red-600 text-sm">단순 참고값</strong>입니다. 입력한 가구원 수를 법원이 부양가족으로 인정했다는 뜻이 아니며, 실제 지출 초과분·청산가치·현재가치·채권자 의견을 반영하지 않았습니다.</p>
        </div>

        <!-- 현금흐름 안내 -->
        ${monthlyDisp > 0 ? `
        <div class="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl p-4 mt-4">
          <span class="text-xl shrink-0 mt-0.5">📅</span>
          <div>
            <p class="font-bold text-amber-800 text-sm mb-1">월별 현금흐름 준비 — 상여금·보너스가 있는 경우</p>
            <p class="text-xs text-slate-600">급여명세서·원천징수영수증 등 소득자료를 바탕으로 월평균을 산정하지만, 구체적인 기간과 방법은 소득 형태·변동 사정·법원 보정에 따라 달라질 수 있습니다. 인가된 변제계획의 납부일과 금액을 지키고, 상여금 등 변동소득이 있는 경우에는 납부 재원을 미리 나누어 두세요. 미납은 폐지 사유가 될 수 있으므로 발생 즉시 관할 법원 안내를 확인해야 합니다.</p>
          </div>
        </div>` : ''}
      </div>`;
    }

    // ── 상세 결과: 접힌 아코디언 조립 ──
    const cardsHtml =
      buildCard('개인회생',     'rehab',    data, hardBlocked) +
      buildCard('개인파산·면책', 'bankrupt', data, hardBlocked);

    const sections = [];
    sections.push(accordionShell('sec-cards', '🔍 입력값에서 확인할 사항 — 절차별 점검',
      `<div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2">${cardsHtml}</div>`));

    const tossupHtml = buildTossupAdvice();
    sections.push(accordionShell('sec-tossup', '🤔 개인회생과 개인파산을 함께 검토할 때', `<div class="pt-2">${tossupHtml}</div>`));

    if (repayDetailHtml) sections.push(accordionShell('sec-repay', '📐 60% 기준 숫자 참고 · 법적 근거', repayDetailHtml));

    const trusteeHtml = buildTrusteeWarning(data);
    sections.push(accordionShell('sec-trustee', '⚠️ 개인파산을 검토할 때 확인할 파산관재인 안내', `<div class="pt-2">${trusteeHtml}</div>`));

    document.getElementById('detail-accordions').innerHTML = sections.join('');
  }

  renderResults();

  // ── 다음 단계 CTA ──
  function buildNextStepCta(hardBlocked) {
    if (hardBlocked.rehab && hardBlocked.bankrupt) return '';

    return `
      <div class="bg-gradient-to-r from-blue-50 to-slate-50 border-2 border-blue-300 rounded-2xl p-5 shadow-md">
        <p class="text-blue-600 text-xs font-semibold mb-1">🧭 다음 단계</p>
        <h3 class="font-bold text-slate-800 text-base">절차를 정하기 전에 두 안내를 비교하세요</h3>
        <p class="text-slate-500 text-sm mt-1">이 진단은 개인회생·개인파산 중 하나를 추천하거나 신청 가능성을 확정하지 않습니다. 공식 요건과 주의사항을 확인한 뒤 본인이 선택하세요.</p>
        <div class="mt-4 flex flex-wrap gap-2">
          <a href="rehabilitation.html" class="px-4 py-2 bg-blue-700 text-white rounded-xl text-sm font-semibold hover:bg-blue-800 transition-colors">개인회생 절차안내</a>
          <a href="bankruptcy.html" class="px-4 py-2 bg-slate-700 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition-colors">개인파산 절차안내</a>
          <a href="compare.html" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-50 transition-colors">신복위 포함 제도 비교</a>
          <a href="numcheck.html?tab=cost" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-50 transition-colors">법원 비용·숫자 확인</a>
        </div>
      </div>`;
  }

  // CTA는 점수 없이 객관적 법정 제한 입력만 확인한다.
  (function renderCta() {
    const data       = Storage.load('diagnosis_data')   || {};
    const priors     = data.priorAdjustments || [];
    const hardBlocked = {
      rehab:    priors.includes('rehab-ongoing') || (data.unsecuredDebt || 0) > 1_000_000_000 || (data.securedDebt || 0) > 1_500_000_000,
      bankrupt: priors.includes('bankrupt-ongoing'),
    };
    document.getElementById('next-step-cta').innerHTML = buildNextStepCta(hardBlocked);
  })();
</script>
</body>
