<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진단 결과 | 챔로드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#533afd">
</head>
<body class="bg-slate-50">

<div id="header-placeholder"></div>

<section class="bg-blue-700 text-white py-8">
  <div class="max-w-4xl mx-auto px-4 text-center">
    <h1 class="text-2xl md:text-3xl font-bold mb-1">채무진단 결과</h1>
    <p id="result-date" class="text-blue-200 text-sm"></p>
  </div>
</section>

<div class="max-w-4xl mx-auto px-4 py-8">

  <!-- ═══ 간단 결과 (첫 화면): 추천 → 핵심 숫자 → 위험 요약 → 다음 단계 ═══ -->

  <!-- 최적 절차 추천 배너 -->
  <div id="best-recommendation" class="mb-3"><!-- JS 렌더링 --></div>

  <!-- 한 줄 참고 고지 -->
  <p id="mini-disclaimer" class="text-sm text-slate-500 text-center mb-5 font-medium">본 결과는 입력값 기반 참고용 분석으로 법률상담이 아니며, 최종 판단은 법원 결정과 전문가 검토에 따라 달라질 수 있습니다.</p>

  <!-- 핵심 숫자 요약 -->
  <div id="key-numbers" class="mb-4"></div>

  <!-- 면책불허가 위험 요약 스트립 (누르면 상세) -->
  <div id="risk-strip" class="mb-4"></div>

  <!-- 다음 단계 CTA -->
  <div id="next-step-cta" class="mb-8"></div>

  <!-- ═══ 상세 결과 (접힌 아코디언 — 궁금한 사람만 펼쳐보기) ═══ -->
  <div id="detail-accordions" class="space-y-3"></div>

  <div class="text-center mt-6 text-sm">
    <a href="diagnosis.html" class="text-slate-500 hover:text-blue-700 underline">다시 진단하기</a>
  </div>

  <!-- 하단 고지 -->
  <div class="disclaimer-box mt-16 flex items-start gap-2">
    <span class="shrink-0">⚠️</span>
    <span>위 결과는 입력하신 정보를 바탕으로 한 참고용 분석입니다. 법률상담·법률대리·결과 보장이 아니며, 최종 판단은 법원 결정 및 전문가 검토에 따라 달라질 수 있습니다. 구체적인 법률 판단이 필요한 경우 변호사, 법무사, 대한법률구조공단(국번없이 132) 등 전문가 상담을 권장합니다.</span>
  </div>
</div>

<div id="footer-placeholder"></div>
<div id="toast"></div>

<script src="js/main.js"></script>
<script>
  initPage('diagnosis');

  // ── 신청 불가 → 강제 0% 처리 ──
  function applyHardBlocks(scores, data) {
    const s      = { rehab: scores.rehab || 0, bankrupt: scores.bankrupt || 0 };
    const priors = data.priorAdjustments || [];
    const unsecured = data.unsecuredDebt || 0;
    const secured   = data.securedDebt   || 0;

    if (priors.includes('rehab-done-recent')    || priors.includes('rehab-ongoing'))    s.rehab    = 0;
    if (priors.includes('bankrupt-done-recent') || priors.includes('bankrupt-ongoing')) s.bankrupt = 0;
    if (unsecured > 1_000_000_000 || secured > 1_500_000_000) s.rehab = 0;

    return s;
  }

  // ── 진행이 막히는 사유 반환 (있으면 {label, text}, 없으면 null) ──
  // ⚠️ 법적 성질을 구분해서 쓴다. 중복 신청·법정 한도 초과는 실제로 '신청 불가'지만,
  //    재신청 대기기간(제595조 제5호·제564조 제1항 제4호)은 신청 자격 제한이 아니라
  //    법원의 '재량' 기각·불허가 사유다(제595조 "기각할 수 있다" / 제564조 제2항 재량면책).
  //    이것을 '신청 불가'로 단정하면 잘못된 법률 안내가 된다.
  function getHardBlockReason(type, data) {
    const unsecured = data.unsecuredDebt    || 0;
    const secured   = data.securedDebt      || 0;
    const priors    = data.priorAdjustments || [];
    if (type === 'rehab') {
      if (priors.includes('rehab-done-recent'))
        return { label: '기각 가능', text: '개인회생 면책 확정 후 5년 미경과 — 법원이 개시신청을 기각할 수 있는 사유(채무자회생법 제595조 제5호). 신청 자체가 금지되는 것은 아니지만 기각 위험이 큽니다.' };
      if (priors.includes('rehab-ongoing'))
        return { label: '신청불가', text: '현재 개인회생 진행 중 — 중복 신청 불가' };
      if (unsecured > 1_000_000_000)
        return { label: '신청불가', text: `무담보 채무(${formatWon(unsecured)})가 법정 한도(10억) 초과` };
      if (secured   > 1_500_000_000)
        return { label: '신청불가', text: `담보 채무(${formatWon(secured)})가 법정 한도(15억) 초과` };
    }
    if (type === 'bankrupt') {
      if (priors.includes('bankrupt-done-recent'))
        return { label: '면책 위험', text: '파산 면책 확정 후 7년 미경과 — 면책불허가 사유(제564조 제1항 제4호 전단). 다만 법원은 파산에 이르게 된 경위 등을 고려해 재량으로 면책을 허가할 수 있습니다(같은 조 제2항).' };
      if (priors.includes('bankrupt-ongoing'))
        return { label: '신청불가', text: '현재 개인파산 진행 중 — 중복 신청 불가' };
      // 제564조 제1항 제4호 후단 — 개인회생 면책(제624조)을 받은 뒤 5년이 지나지 않으면
      // 파산 면책도 불허가 사유다. 이 사람에게 "파산이 유일한 방법"이라고 안내하면 안 된다.
      if (priors.includes('rehab-done-recent'))
        return { label: '면책 위험', text: '개인회생 면책 확정 후 5년 미경과 — 파산 면책도 불허가 사유에 해당합니다(제564조 제1항 제4호 후단). 면책 확정일을 먼저 확인하시고, 법원은 재량으로 면책을 허가할 수도 있으므로(같은 조 제2항) 전문가 상담을 권합니다.' };
    }
    return null;
  }

  // ── 점수별 색상 설정 ──
  function scoreTheme(score) {
    if (score >= 60) return { text:'text-green-700', bar:'bg-green-500', border:'border-green-300', label:'적합' };
    if (score >= 30) return { text:'text-amber-700', bar:'bg-amber-400', border:'border-amber-300', label:'조건부 검토' };
    if (score >  0)  return { text:'text-slate-400', bar:'bg-slate-300', border:'border-slate-200', label:'부적합' };
    return { text:'text-red-500', bar:'bg-red-200', border:'border-red-100', label:'불가' };
  }

  // ── 설문 데이터 기반 개인화 사유 생성 ──
  function buildReasons(data, type, hardBlocked = {}) {
    const pros = [], cons = [];
    const income      = data.monthlyIncome  || 0;
    const living      = data.monthlyLiving  || 0;
    // 변제 여력은 저장된 변제금 계산(표준생계비 반영)과 동일한 기준을 사용 — 배너·카드·상세 수치 불일치 방지
    const repayCalc   = Storage.load('diagnosis_repay') || {};
    const courtLiving = repayCalc.effectiveLiving || living;
    const disposable  = (repayCalc.monthly !== undefined) ? repayCalc.monthly : Math.max(0, income - living);
    const unsecured   = data.unsecuredDebt  || 0;
    const secured     = data.securedDebt    || 0;
    const totalDebt   = data.totalDebt      || 0;
    const totalAssets = data.totalAssets    || 0;
    const arrears     = data.arrearsMonths  || 0;
    const priors      = data.priorAdjustments || [];
    const causes      = data.debtCauses     || [];
    if (type === 'rehab') {
      // 유리한 점
      if (data.hasIncome && income > 0)
        pros.push(`정기소득 있음 (월 ${formatWon(income)}) — 변제계획 수립의 핵심 조건 충족`);
      if (disposable > 0)
        pros.push(`<span class="term-tip" data-tip="월 소득에서 생활비를 뺀 금액. 채무조정에서 실제 변제 여력을 나타내는 용어로 사용됩니다.">가처분소득</span> 월 ${formatWon(disposable)} → 3년 총 변제 가능 추정액 약 ${formatWon(disposable * 36)}`);
      if (unsecured > 0 && unsecured <= 1_000_000_000)
        pros.push(`무담보 채무 ${formatWon(unsecured)} — 법정 신청 한도(10억) 이내`);
      if (secured > 0 && secured <= 1_500_000_000)
        pros.push(`담보 채무 ${formatWon(secured)} — 법정 신청 한도(15억) 이내`);
      if (arrears > 0)
        pros.push('연체 중 — 신청 시 법원의 중지·금지명령(제593조)으로 추심·강제집행 중단 가능, 개시결정(제600조) 시 자동 중지');

      // 불리한 점
      if (!data.hasIncome || income === 0)
        cons.push('소득 없음 — 변제계획 수립 불가, 개인파산 검토가 우선됩니다');
      else if (disposable <= 0)
        cons.push(`소득(${formatWon(income)})이 법원 인정 생계비 기준(${formatWon(courtLiving)}) 이하 — 변제 여력이 없는 것으로 계산됩니다`);
      if (unsecured > 1_000_000_000)
        cons.push(`무담보 채무(${formatWon(unsecured)})가 법정 한도(10억) 초과 — 개인회생 신청 자체가 불가`);
      if (secured > 1_500_000_000)
        cons.push(`담보 채무(${formatWon(secured)})가 법정 한도(15억) 초과 — 개인회생 신청 자체가 불가`);
      if (priors.includes('rehab-done-recent'))
        cons.push('개인회생 면책 확정 후 5년 미경과 — 신청 기각 사유에 해당합니다(채무자회생법 제595조 제5호)');
      if (priors.includes('rehab-ongoing'))
        cons.push('현재 개인회생 진행 중 — 중복 신청 불가');
      if (priors.includes('bankrupt-done-recent'))
        cons.push('파산 면책 이력 있음 — 면책 확정 후 5년이 지나지 않았다면 개인회생 신청도 기각 사유(채무자회생법 제595조 제5호)에 해당합니다. 면책 확정일을 먼저 확인하세요');
      if (data.recentLoan === 'within-3m')
        cons.push('최근 3개월 이내 신규 대출 있음 — 갚을 의사·능력 없이 빌린 것으로 의심받으면 채권자가 이의를 제기하거나 형법상 사기죄(제347조)로 고소할 수 있으며, 신청 기각·해당 채무 면책 제외로 이어질 수 있습니다. 대출 시점·사용처를 소명할 자료를 준비하세요');
      else if (data.recentLoan === 'within-1y')
        cons.push('최근 1년 이내 신규 대출 있음 — 채무 발생 경위 심사에서 대출 시점과 사용처에 대한 소명이 필요할 수 있습니다');
    }

    if (type === 'bankrupt') {
      // 유리한 점
      // 채무 규모 초과는 파산의 '유리한 점'이 맞지만, 재신청 대기기간은 아니다 —
      // 개인회생 면책 후 5년 미경과는 파산 면책도 불허가 사유(제564조 1항 4호 후단)라 유리할 게 없다.
      if (hardBlocked.rehab && !priors.includes('rehab-done-recent') && !priors.includes('rehab-ongoing'))
        pros.push(`개인회생 법정 한도 초과 — 법원 절차 중에서는 파산·면책이 남은 선택`);
      if (!data.hasIncome || income === 0)
        pros.push('소득 없음 — 변제 불능 상태로 파산의 핵심 요건에 해당');
      else if (income < courtLiving)
        pros.push(`소득(${formatWon(income)})이 법원 인정 생계비 기준(${formatWon(courtLiving)})에 미달 — 변제 불능에 가까운 상태`);
      if (totalDebt > 0 && totalAssets < totalDebt * 0.2)
        pros.push(`총 재산(${formatWon(totalAssets)})이 총 채무(${formatWon(totalDebt)})의 20%에도 못 미쳐 채무초과 상태`);
      if (totalAssets < 5_000_000)
        pros.push('보유 재산이 거의 없어 파산재단 편입 부담이 적음');
      if (arrears >= 18)
        pros.push('1년 이상 장기 연체 — 변제 의사·능력 부재 상태로 파산 요건 충족 가능성 높음');

      // 불리한 점
      if (data.hasIncome && disposable > 0 && !hardBlocked.rehab)
        cons.push(`<span class="term-tip" data-tip="월 소득에서 생활비를 뺀 금액. 채무조정에서 실제 변제 여력을 나타내는 용어로 사용됩니다.">가처분소득</span>이 월 ${formatWon(disposable)} 발생 — 변제 여력이 있어 개인회생이 더 적합할 수 있음`);
      if (data.hasIncome && income > 0)
        cons.push(`소득(월 ${formatWon(income)})이 있어 법원이 변제 불능 여부를 엄격히 심사합니다 — 수입·지출 내역, 부채 증빙 서류를 충분히 준비해야 합니다`);
      if (priors.includes('rehab-done-recent'))
        cons.push('개인회생 면책 확정 후 5년 미경과 — <strong>파산 면책도 불허가 사유</strong>에 해당합니다(채무자회생법 제564조 제1항 제4호 후단). 면책 후 채무가 재발생한 경위도 법원에 소명해야 합니다');
      if (causes.includes('gambling'))
        cons.push('도박·사행성 채무 포함 — 면책불허가 사유(채무자회생법 제564조) 해당 가능, 파산선고를 받더라도 면책이 거부될 위험 있음');
      if (causes.includes('investment'))
        cons.push('투자 손실 채무 포함 — 과도한 투기로 판단될 경우 면책불허가 사유(채무자회생법 제564조) 검토 대상이 될 수 있음');
      if (arrears > 0 && arrears < 5)
        cons.push('연체 기간이 짧아 지급불능 상태 입증이 중요합니다 — 소득·자산 대비 채무 초과 상태를 구체적으로 소명하는 서류가 필요합니다');
      if (data.recentLoan === 'within-3m' || data.recentLoan === 'within-1y')
        cons.push('최근 1년 이내 신규 대출 있음 — 파산선고 전 1년 이내에 지급불능 상태를 숨기고 신용거래로 재산을 취득한 경우 면책불허가 사유(채무자회생법 제564조 제1항 제2호)에 해당할 수 있고, 채권자가 형법상 사기죄(제347조)로 고소할 수도 있습니다. 대출 시점·사용처를 소명할 자료를 준비하세요');
      if (totalAssets >= 5_000_000)
        cons.push(`보유 재산(${formatWon(totalAssets)}) — 일정 한도 초과분은 파산재단에 편입되어 처분될 수 있습니다. 재산 목록을 정확히 신고해야 합니다`);
      if (!causes.includes('gambling'))
        cons.push('낭비·사치성 소비, 허위 재산신고 등도 면책불허가 사유(채무자회생법 제564조)에 해당할 수 있습니다 — 채무 발생 경위를 정확히 정리하세요');
      if (priors.includes('bankrupt-done-recent'))
        cons.push('파산 면책 확정 후 7년 미경과 — 면책불허가 사유에 해당합니다(채무자회생법 제564조 제1항 제4호 전단). 다만 법원은 파산에 이르게 된 경위 등을 고려해 재량으로 면책을 허가할 수 있습니다(같은 조 제2항)');
      if (priors.includes('bankrupt-denied'))
        cons.push('이전 면책불허가 결정 이력 있음 — 재신청 시 심사에서 불리하게 작용하며, 채무 발생 경위 소명이 특히 중요합니다');
      if (priors.includes('bankrupt-ongoing'))
        cons.push('현재 개인파산 진행 중 — 중복 신청 불가');
    }

    return { pros, cons };
  }

  // ── 적합도 카드 ──
  function buildCard(title, type, score, data, hardBlocked = {}, isWinner = false) {
    const th = scoreTheme(score);
    const { pros, cons } = buildReasons(data, type, hardBlocked);
    const icons = { rehab:'📋', bankrupt:'⚖️' };
    const blockReason = getHardBlockReason(type, data);

    // 진행이 막히는 사유 카드
    if (score === 0 && blockReason) {
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-5 flex flex-col">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-start gap-2 font-bold text-slate-800 text-base">
              <span class="shrink-0">${icons[type]}</span><span>${title}</span>
            </div>
            <div class="shrink-0 ml-3 bg-red-50 border border-red-200 rounded-lg px-3 py-1.5 text-center">
              <div class="text-sm font-extrabold text-red-600 leading-none">${blockReason.label}</div>
            </div>
          </div>
          <div class="bg-red-50 border border-red-100 rounded-lg px-3 py-2.5 text-xs text-red-700 leading-relaxed">
            <span class="font-semibold">사유:</span> ${blockReason.text}
          </div>
        </div>`;
    }

    const prosHtml = pros.slice(0, 3).map(p =>
      `<li class="flex gap-2 text-xs text-slate-600 leading-snug">
         <span class="text-green-500 shrink-0 font-bold mt-0.5">✓</span><span>${p}</span>
       </li>`).join('');

    const consHtml = cons.slice(0, 5).map(c =>
      `<li class="flex gap-2 text-xs text-slate-600 leading-snug">
         <span class="text-red-400 shrink-0 font-bold mt-0.5">✗</span><span>${c}</span>
       </li>`).join('');

    const borderClass = isWinner && score > 0 ? 'border-2 border-green-500' : `border ${th.border}`;
    return `
      <div class="bg-white rounded-2xl shadow-sm ${borderClass} p-5 flex flex-col">
        <div class="flex items-start justify-between mb-1">
          <div class="flex items-start gap-2 font-bold text-slate-800 text-base">
            <span class="shrink-0">${icons[type]}</span>
            <span>${title}</span>
          </div>
          <div class="text-right shrink-0 ml-3">
            <div class="text-2xl font-extrabold ${th.text} leading-none">${Math.round(score)}%</div>
            <div class="text-xs ${th.text} mt-0.5">${th.label}</div>
          </div>
        </div>
        <div class="h-2 bg-slate-100 rounded-full mb-6 overflow-hidden">
          <div class="${th.bar} h-full rounded-full" style="width:${Math.round(score)}%"></div>
        </div>
        ${pros.length ? `
        <div class="mb-3">
          <p class="text-xs font-semibold text-green-700 mb-1.5">${score < 30 ? '참고 — 여건이 갖춰지면 유리해질 수 있는 점' : '귀하의 상황에 유리한 점'}</p>
          <ul class="space-y-1.5">${prosHtml}</ul>
        </div>` : ''}
        ${cons.length ? `
        <div class="${pros.length ? 'mt-3 pt-3 border-t border-slate-100' : ''}">
          <p class="text-xs font-semibold text-red-600 mb-1.5">주의 또는 불리한 점</p>
          <ul class="space-y-1.5">${consHtml}</ul>
        </div>` : ''}
      </div>`;
  }

  // ── 최적 절차 추천 배너 ──
  function buildBanner(scores, data, hardBlocked = {}) {
    const list = [
      { type:'rehab',    title:'개인회생',     score: scores.rehab    },
      { type:'bankrupt', title:'개인파산·면책', score: scores.bankrupt },
    ].sort((a, b) => b.score - a.score);

    const best   = list[0];
    const second = list[1];
    const gap    = best.score - second.score;

    // 두 절차 모두 신청불가
    if (best.score === 0 && hardBlocked.rehab && hardBlocked.bankrupt) {
      return `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
        <p class="text-red-700 font-bold text-base mb-1">두 절차 모두 그대로 진행하기 어려운 상태입니다</p>
        <p class="text-slate-500 text-sm">채무조정 이력 또는 채무 규모 때문입니다. 재신청 대기기간에 해당하는 경우 신청 자체가 금지되는 것은 아니지만, 법원이 기각하거나 면책을 불허가할 수 있는 사유에 해당합니다. 위 카드의 사유를 확인하시고 법률전문가 상담을 받아 보세요.</p>
      </div>`;
    }

    // 최고 점수가 너무 낮으면 안내 메시지 변경
    if (best.score < 20) {
      return `<div class="bg-slate-100 border border-slate-200 rounded-2xl p-5 text-center">
        <p class="text-slate-600 font-semibold">입력하신 정보만으로는 적합한 절차를 특정하기 어렵습니다.</p>
        <p class="text-slate-400 text-sm mt-1">전문가 상담 또는 추가 정보 입력을 권장드립니다.</p>
      </div>`;
    }

    const dualNote = gap <= 20 && second.score >= 30
      ? `<p class="text-blue-100 text-sm mt-2">
           <strong>${second.title}</strong>도 적합도 ${Math.round(second.score)}%로 동시 검토 가능합니다.
           장단점은 아래 '왜 이 결과가 나왔나요?'에서 비교할 수 있습니다.
         </p>`
      : '';

    const icons = { rehab:'📋', bankrupt:'⚖️' };

    return `
      <div class="bg-gradient-to-r from-blue-700 to-blue-500 text-white rounded-2xl p-6">
        <div class="flex items-center gap-2 text-blue-200 text-sm font-semibold mb-2">
          <span>⭐</span> 입력하신 상황에 가장 적합한 절차
        </div>
        <div class="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 class="text-2xl font-extrabold">${icons[best.type]} ${best.title}</h2>
            <p class="text-blue-100 text-sm mt-1">${buildBestReason(data, best.type)}</p>
            ${dualNote}
          </div>
          <div class="text-center shrink-0 bg-white/15 rounded-xl px-6 py-3">
            <div class="text-4xl font-extrabold">${Math.round(best.score)}%</div>
            <div class="text-blue-200 text-xs mt-1">적합도</div>
          </div>
        </div>
      </div>`;
  }

  // ── 최적 절차 선택 이유 한 줄 요약 ──
  function buildBestReason(data, type) {
    const income     = data.monthlyIncome || 0;
    // 변제 여력은 표준생계비 반영 계산값과 동일 기준 사용
    const repayCalc  = Storage.load('diagnosis_repay') || {};
    const disposable = repayCalc.monthly || 0;
    const arrears    = data.arrearsMonths || 0;

    if (type === 'rehab') {
      if (disposable > 0)
        return `정기소득(월 ${formatWon(income)})과 변제 여력(월 ${formatWon(disposable)})이 있어 채무 일부 변제 후 면책이 가능한 구조입니다.`;
      return '소득이 있고 채무조정이 필요한 상황으로, 개인회생 절차 검토를 권장합니다.';
    }
    if (type === 'bankrupt') {
      const unsecured = data.unsecuredDebt || 0;
      const secured   = data.securedDebt   || 0;
      const priors    = data.priorAdjustments || [];
      if (unsecured > 1_000_000_000 || secured > 1_500_000_000)
        return `채무가 개인회생 법정 한도(무담보 10억·담보 15억)를 초과해 법원 절차 중 개인파산이 유일한 선택입니다.`;
      // ⚠️ 개인회생 면책 후 5년 미경과자에게 "파산이 유일한 방법"이라 권하면 안 된다 —
      //    바로 그 사람이 제564조 제1항 제4호 후단으로 파산 면책도 불허가 사유에 걸린다.
      if (priors.includes('rehab-done-recent'))
        return `개인회생은 재신청 대기기간에 걸려 있으나, 개인파산도 개인회생 면책 확정 후 5년이 지나지 않으면 면책불허가 사유에 해당합니다(제564조 제1항 제4호 후단). 면책 확정일을 먼저 확인하고 전문가 상담을 받아 보세요.`;
      if (priors.includes('rehab-ongoing'))
        return `개인회생이 진행 중이어서 중복 신청은 할 수 없습니다. 진행 중인 절차를 유지할지, 파산으로 전환할지부터 정리가 필요합니다.`;
      if (!data.hasIncome || income === 0)
        return '현재 소득이 없어 변제 자체가 불가능한 상태로, 파산·면책 절차가 가장 현실적인 해결책입니다.';
      return '소득이 생활비에 미달하거나 재산보다 채무가 현저히 많아 파산 절차 검토를 권장합니다.';
    }
    return '';
  }

  // ── 접이식 섹션 셸 (상세 정보 아코디언 공통) ──
  function accordionShell(id, title, contentHtml, open = false) {
    return `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <button onclick="toggleSection('${id}')" class="w-full flex items-center justify-between gap-2 px-5 py-4 text-left hover:bg-slate-50 transition-colors">
          <span class="text-sm font-semibold text-slate-700">${title}</span>
          <span id="${id}-chev" class="acc-chev text-slate-400 text-xs shrink-0">${open ? '접기 ▲' : '펼치기 ▼'}</span>
        </button>
        <div id="${id}-body" class="acc-body ${open ? '' : 'hidden'} px-5 pb-5">${contentHtml}</div>
      </div>`;
  }

  function toggleSection(id) {
    const b = document.getElementById(id + '-body');
    const c = document.getElementById(id + '-chev');
    if (!b) return;
    b.classList.toggle('hidden');
    if (c) c.textContent = b.classList.contains('hidden') ? '펼치기 ▼' : '접기 ▲';
  }

  // ── 핵심 숫자 요약 (첫 화면) ──
  function buildKeyNumbers(scores, data, repay, winnerType) {
    const best = Math.max(scores.rehab, scores.bankrupt);
    if (best < 20) return '';

    const cell = (label, value, sub) => `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 text-center">
        <div class="text-xs text-slate-500 mb-1">${label}</div>
        <div class="text-xl font-bold text-blue-700">${value}</div>
        ${sub ? `<div class="text-xs text-slate-400 mt-1">${sub}</div>` : ''}
      </div>`;

    // 개인회생 우세: 변제금 3종 요약
    if (winnerType === 'rehab' && scores.rehab >= 30) {
      const hasRepay = repay && typeof repay.monthly === 'number';
      const monthly = hasRepay ? repay.monthly : 0;
      const total36 = repay.total36 || 0;
      const exempt  = Math.max(0, repay.exempt || 0);
      const zeroNote = !hasRepay ? `
        <div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3">
          <span class="shrink-0">⚠️</span>
          <p class="text-xs text-slate-600">저장된 진단 데이터가 불완전해 변제액을 계산할 수 없습니다. <a href="diagnosis.html" class="text-blue-600 underline">무료 진단을 다시 실행</a>해 주세요.</p>
        </div>` : monthly === 0 ? `
        <div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3">
          <span class="shrink-0">⚠️</span>
          <p class="text-xs text-slate-600">소득이 표준생계비에 미치지 못해 월 변제액이 0원으로 계산됩니다. 이 경우 법원이 개인파산·면책 검토를 권고할 수 있습니다 — 아래 '예상 변제금 계산 근거'에서 자세히 확인하세요.</p>
        </div>` : '';
      // 재직 중인 이용자에게는 퇴직금 경고를 따로 띄운다.
      // ⚠️ 무료 진단은 예상 퇴직금을 묻지 않아 totalAssets가 0으로 잡히므로, 아래 '재산 > 변제총액'
      //    경고가 4대보험 가입 직장인에게는 사실상 절대 뜨지 않는다. 그런데 퇴직금의 1/2이
      //    청산가치에 산입되므로(제614조 제1항 제4호), 총 변제금이 적을수록 오히려 걸릴 확률이 높다.
      const employed = data.hasIncome && /^employed/.test(data.incomeType || '');
      const liqNote = (data.totalAssets || 0) > total36 ? `
        <p class="text-xs text-amber-600 mt-2 text-center">※ 보유 재산이 3년 변제총액보다 많아 실제 변제금이 늘거나 기간이 연장(최대 5년)될 수 있습니다 — 아래 계산 근거 참고.</p>`
        : (employed && total36 > 0) ? `
        <div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mt-3">
          <span class="shrink-0">⚖️</span>
          <p class="text-xs text-slate-600"><strong class="text-amber-800">재직 중이시면 예상 퇴직금의 1/2이 청산가치에 더해집니다.</strong>
            그 금액이 위 <strong>예상 총 변제금(${formatWon(total36)})</strong>보다 크면 3년 계획으로는 청산가치 보장 원칙(채무자회생법 제614조 제1항 제4호)을 맞추지 못해,
            월 변제액을 올리거나 변제기간을 연장(최대 5년)해야 합니다. 회사에서 <strong>퇴직금 예상액 증명서</strong>를 받아 확인해 보세요.</p>
        </div>` : '';
      return `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          ${cell('월 변제 가능 추정액', formatWon(monthly), '소득 − 적용 생계비')}
          ${cell('예상 총 변제금', formatWon(total36),
            (data.totalDebt > 0 && total36 >= 0)
              ? `36개월 기준 · 총 변제율 약 ${(total36 / data.totalDebt * 100).toFixed(1)}%`
              : '36개월 기준')}
          ${cell('면책 가능 채무 추정액', formatWon(exempt), '총 채무 − 총 변제금')}
        </div>
        <p class="text-xs text-slate-500 mt-2 text-center">※ 준비 방향을 잡기 위한 <strong>추정치</strong>입니다. 재직 중이라면 예상 퇴직금의 절반이 재산에 더해지고, 부양가족 수·법원이 인정하는 생계비 범위에 따라 실제 변제금은 달라집니다.</p>${zeroNote}${liqNote}`;
    }

    // 개인파산 우세: 입력 정보 요약 (면책 범위는 법원이 결정)
    return `
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        ${cell('총 채무', formatWon(data.totalDebt || 0), '면책 범위는 법원이 결정')}
        ${cell('신고 재산 합계', formatWon(data.totalAssets || 0), '파산재단 산정의 기초')}
        ${cell('채권자 수', (data.creditorCount || 0) + '곳', '채권자 목록 작성 대상')}
      </div>`;
  }

  // ── 면책불허가 위험 요인 수집 ──
  function getDischargeRisks(data, scores) {
    if (scores.bankrupt < scores.rehab) return [];

    const causes     = data.debtCauses       || [];
    const priors     = data.priorAdjustments || [];
    const recentLoan = data.recentLoan       || 'none';

    const risks = [];
    if (causes.includes('gambling'))
      risks.push({ label: '도박·사행성 채무', detail: '대표적인 면책불허가 사유입니다. 다만 채무 발생 경위·반성 정도 등을 고려해 법원이 재량으로 면책(일부면책 포함)을 허가하는 경우도 있습니다.', law: '채무자회생법 제564조 제1항 제6호' });
    if (causes.includes('investment'))
      risks.push({ label: '투기성 투자 손실', detail: '과도한 투기로 판단되면 면책불허가 사유에 해당합니다. 소액·일시적 투자는 판사 재량에 따라 달라질 수 있습니다.', law: '채무자회생법 제564조 제1항 제6호' });
    if (recentLoan === 'within-3m')
      risks.push({ label: '최근 3개월 이내 신규 대출', detail: '지급불능 상태를 숨기고 신용거래로 재산을 취득한 것으로 판단되면 면책불허가 사유에 해당할 수 있습니다.', law: '채무자회생법 제564조 제1항 제2호' });
    else if (recentLoan === 'within-1y')
      risks.push({ label: '1년 이내 신규 대출', detail: '파산선고 전 1년 이내 신용거래는 면책불허가 사유 심사 대상이 될 수 있습니다.', law: '채무자회생법 제564조 제1항 제2호' });
    if (priors.includes('bankrupt-denied'))
      risks.push({ label: '이전 면책불허가 이력', detail: '재신청 시 법원이 과거 불허가 사유를 다시 검토하므로 심사가 더 엄격해집니다.', law: '재심사 시 불리하게 작용' });

    return risks;
  }

  // ── 위험 요약 스트립 (첫 화면) — 누르면 상세가 펼쳐짐 ──
  function buildRiskStrip(data, scores) {
    const risks = getDischargeRisks(data, scores);
    if (risks.length === 0) return '';
    const labels = risks.map(r => r.label).join(' · ');
    return `
      <div class="bg-red-50 border border-red-200 rounded-2xl overflow-hidden">
        <button onclick="toggleSection('risk-sec')" class="w-full flex items-center justify-between gap-2 px-5 py-4 text-left hover:bg-red-100 transition-colors">
          <span class="text-sm font-bold text-red-700">🚨 진행 전 확인할 위험 ${risks.length}건 — ${labels}</span>
          <span id="risk-sec-chev" class="acc-chev text-red-400 text-xs shrink-0">펼치기 ▼</span>
        </button>
        <div id="risk-sec-body" class="acc-body hidden px-5 pb-5">${buildRiskDetail(scores, risks)}</div>
      </div>`;
  }

  // ── 위험 상세 본문 ──
  function buildRiskDetail(scores, risks) {
    const altRehabNote = scores.rehab >= 30
      ? `<div class="mt-4 pt-4 border-t border-red-200">
           <p class="text-sm font-semibold text-slate-700 mb-1">💡 대안 검토 — 개인회생</p>
           <p class="text-xs text-slate-600">개인회생은 파산과 달리 면책불허가 사유 기준이 더 관대합니다. 소득이 있다면 파산보다 개인회생 절차를 우선 검토하는 것이 안전합니다. 아래 '왜 이 결과가 나왔나요?'의 비교 분석을 참고하세요.</p>
         </div>`
      : `<div class="mt-4 pt-4 border-t border-red-200">
           <p class="text-xs text-slate-600">파산 외 대안이 제한적인 상황입니다. 신청 전 <strong>대한법률구조공단(132)</strong> 무료 상담을 통해 면책 가능성을 먼저 확인하세요.</p>
         </div>`;

    return `
      <p class="text-sm text-red-700 mt-1 mb-4">채무 발생 원인 중 <strong>면책불허가 사유</strong>에 해당할 수 있는 항목이 확인됩니다. 이 경우 파산선고는 받아도 면책은 거부될 수 있습니다.</p>

      <div class="space-y-2.5 mb-4">
        ${risks.map(r => `
          <div class="flex gap-2.5 bg-white border border-red-100 rounded-xl px-4 py-3">
            <span class="text-red-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">${r.label}</p>
              <p class="text-xs text-slate-500 mt-0.5">${r.detail}</p>
              <p class="text-xs text-red-400 mt-0.5">근거: ${r.law}</p>
            </div>
          </div>`).join('')}
      </div>

      <div class="bg-red-100 border border-red-200 rounded-xl p-4">
        <p class="text-sm font-bold text-red-800 mb-2">면책불허가가 확정되면 어떻게 되나요?</p>
        <ul class="space-y-1.5 text-xs text-slate-700">
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>채무 그대로 유지</strong> — 파산 신청 전 채무를 전액 변제해야 하며, 채무에서 벗어날 방법이 없습니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>파산자 신분 지속</strong> — 복권되지 않아 공직·일부 자격 취득 제한 등 불이익이 계속됩니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>불복은 즉시항고로</strong> — 불허가 결정에 불복하려면 정해진 기간 내에 즉시항고를 제기해 다퉈야 합니다.</span></li>
          <li class="flex gap-2"><span class="text-red-500 shrink-0 mt-0.5">▸</span><span><strong>동일 건 재신청 불가</strong> — 같은 파산 건으로 면책을 다시 신청할 수 없습니다.</span></li>
        </ul>
        <p class="text-xs text-red-700 font-semibold mt-3">→ 파산자의 불이익은 다 받으면서, 채무는 그대로인 최악의 결과입니다.</p>
      </div>

      ${altRehabNote}`;
  }

  // ── 절차 선택 도우미: 점수 근접할 때 개인화 비교 ──
  function buildTossupAdvice(scores, data, repay) {
    const OPTS = [
      { type: 'rehab',    score: scores.rehab,    title: '개인회생',     subj: '이', icon: '📋', border: 'border-blue-200',  bg: 'bg-blue-50/30',  iconCls: 'text-blue-500',  titleCls: 'text-blue-700'  },
      { type: 'bankrupt', score: scores.bankrupt,  title: '개인파산·면책', subj: '이', icon: '⚖️', border: 'border-slate-200', bg: 'bg-slate-50/40', iconCls: 'text-slate-500', titleCls: 'text-slate-700' },
    ].filter(x => x.score >= 30).sort((a, b) => b.score - a.score);

    if (OPTS.length < 2 || OPTS[0].score - OPTS[1].score > 20) return '';

    const A = OPTS[0], B = OPTS[1];
    const pair = [A.type, B.type].sort().join('+'); // 항상 알파벳 순으로 정렬된 키

    // 공통 데이터
    const income      = data.monthlyIncome || 0;
    const living      = data.monthlyLiving || 0;
    // repay.monthly·total36은 표준생계비(기준중위소득 60%) 공제 후 실제 변제 여력 — 진단 시 저장된 값 사용
    const disposable  = repay.monthly || 0;
    const repayable36 = repay.total36  || 0;
    const totalDebt   = data.totalDebt    || 0;
    const totalAssets = data.totalAssets  || 0;
    const arrears     = data.arrearsMonths || 0;

    // A, B 각각의 유리한 요인 배열 (type 기준으로 push 대상 결정)
    const factorMap = { [A.type]: [], [B.type]: [] };
    const push = (type, item) => factorMap[type].push(item);

    // ── 쌍별 요인 분석 ──

    if (pair === 'bankrupt+rehab') {
      // 개인회생 유리한 이유
      if (data.hasLegalAction)
        push('rehab', { text: '압류·법적 조치 진행 중 — 조기 중단 가능', weight: 3,
          reason: '개인회생은 신청과 동시에 중지·금지명령을 신청할 수 있고, 법원이 명령을 내리면 강제집행·추심이 중단됩니다(채무자회생법 제593조). 개시결정이 나면 자동으로 중지됩니다(제600조). 개인파산은 파산선고 후에야 집행이 정지되어 상대적으로 늦을 수 있습니다.' });
      if (disposable > 0)
        push('rehab', { text: '변제 여력 있음', weight: 3,
          reason: `월 ${formatWon(disposable)}의 가처분소득이 있습니다. 변제 능력이 있는 상황에서 법원은 파산보다 개인회생을 우선 검토하며, 36개월 변제 완수 후 나머지 채무를 면책받을 수 있습니다.` });
      if (totalAssets >= 10_000_000)
        push('rehab', { text: '보유 재산 있음 — 파산재단 편입 방지', weight: 2,
          reason: `보유 재산(${formatWon(totalAssets)})이 파산 시 파산재단에 편입되어 처분될 수 있습니다. 개인회생은 재산을 유지하며 채무를 조정할 수 있습니다.` });
      if (!(data.debtCauses || []).includes('gambling'))
        push('rehab', { text: '면책불허가 사유 없음', weight: 1,
          reason: '도박·사행성 채무 등 면책불허가 사유가 없어 개인회생 인가 가능성이 높습니다.' });
      // 개인파산 유리한 이유
      if (!data.hasIncome || income === 0)
        push('bankrupt', { text: '소득 없음 — 변제계획 수립 불가', weight: 3,
          reason: '소득이 없으면 개인회생의 변제계획을 수립·이행할 수 없습니다. 파산·면책이 채무를 해소할 수 있는 현실적인 수단입니다.' });
      else if (income < living)
        push('bankrupt', { text: `소득(${formatWon(income)})이 생활비(${formatWon(living)})에 미달`, weight: 3,
          reason: '생활비조차 안 되는 소득으로는 변제 여력이 없습니다. 변제 불능 상태로 파산 요건에 해당합니다.' });
      if (totalDebt > 0 && repayable36 < totalDebt * 0.1 && disposable >= 0)
        push('bankrupt', { text: '채무 규모가 변제 여력 대비 과도', weight: 2,
          reason: `3년 최대 변제액(${formatWon(repayable36)})이 총 채무(${formatWon(totalDebt)})의 ${Math.round(repayable36/totalDebt*100)}%에 불과합니다. 사실상 변제 불능에 가까운 상태입니다.` });
      if (totalAssets < 5_000_000)
        push('bankrupt', { text: '재산 거의 없음 — 파산재단 부담 없음', weight: 2,
          reason: '처분할 재산이 없어 파산 절차에서 재산 손실 부담이 없습니다. 면책 결정 시 모든 채무에서 벗어날 수 있습니다.' });
      if (data.hasHealthIssues)
        push('bankrupt', { text: '건강 문제 — 소득 회복 전망 불투명', weight: 2,
          reason: '장기적으로 소득 창출이 어려운 상황이라면 36개월 변제 의무를 지는 개인회생보다 파산·면책으로 채무를 빠르게 해소하는 것이 현실적입니다.' });
      if (arrears >= 18)
        push('bankrupt', { text: `장기 연체(${arrears}개월) — 지급불능 상태`, weight: 1,
          reason: '1년 6개월 이상의 연체는 지급불능 상태에 해당할 가능성이 높아 파산 요건에 부합합니다.' });
    }

    else return ''; // 알 수 없는 쌍

    const aFactors = factorMap[A.type];
    const bFactors = factorMap[B.type];
    if (aFactors.length === 0 && bFactors.length === 0) return '';

    // ── 종합 판단 ──
    const aw = aFactors.reduce((s, f) => s + f.weight, 0);
    const bw = bFactors.reduce((s, f) => s + f.weight, 0);
    const winner = aw >= bw + 2 ? A : bw >= aw + 2 ? B : null;

    const verdictMessages = {
      'bankrupt+rehab': {
        rehab:   '변제 여력이 있는 상황이라면 파산보다 개인회생이 우선 검토되어야 합니다. 재산을 유지하면서 원금 일부를 감면받을 수 있어 재기에 더 유리합니다.',
        bankrupt:'변제 능력이 없거나 채무가 변제 여력을 크게 초과하는 상황입니다. 무리하게 개인회생을 시도하기보다 파산·면책으로 채무를 해소하는 것이 현실적입니다.',
        tie:     '소득과 변제 여력이 경계선상에 있습니다. 가처분소득이 안정적으로 유지될 수 있다면 개인회생을, 그렇지 않다면 파산·면책을 검토하세요.',
      },
    };

    const msgs = verdictMessages[pair] || {};
    const verdictText = winner ? (msgs[winner.type] || '') : (msgs.tie || '');
    const verdictBgCls = winner
      ? (winner.type === 'rehab' ? 'bg-blue-50 border-blue-200' : 'bg-slate-50 border-slate-200')
      : 'bg-slate-50 border-slate-200';
    const verdictTitleCls = winner
      ? (winner.type === 'rehab' ? 'text-blue-800' : 'text-slate-700')
      : 'text-slate-700';
    const verdictLabel = winner ? `${winner.title} 우선 검토 권장` : '두 절차 모두 유효한 선택';

    const renderFactor = (f, iconCls) => `
      <li class="flex gap-2.5 leading-snug">
        <span class="${iconCls} shrink-0 font-bold mt-0.5">✓</span>
        <div>
          <p class="text-sm font-semibold text-slate-800">${f.text}</p>
          <p class="text-xs text-slate-500 mt-0.5 leading-relaxed">${f.reason}</p>
        </div>
      </li>`;

    return `
      <div>
        <p class="text-sm text-slate-400 mb-1">귀하의 구체적 상황에서 각 절차가 갖는 실질적 장점을 요인별로 분석했습니다.</p>
        <p class="text-xs text-slate-400 mb-4">이 분석은 정성적 요인 비교이며, <strong class="text-slate-500">적합도(%) 점수</strong>와 함께 참고하세요. 두 결과가 다를 수 있습니다.</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div class="border ${A.border} ${A.bg} rounded-xl p-4">
            <div class="flex items-center gap-1.5 mb-3">
              <span class="text-lg">${A.icon}</span>
              <h4 class="font-bold ${A.titleCls} text-sm">${A.title}${A.subj} 유리한 이유</h4>
            </div>
            ${aFactors.length > 0
              ? `<ul class="space-y-3">${aFactors.map(f => renderFactor(f, A.iconCls)).join('')}</ul>`
              : `<p class="text-xs text-slate-400">귀하의 상황에서 ${A.title}${A.subj} 특별히 유리한 요인이 확인되지 않습니다.</p>`}
          </div>
          <div class="border ${B.border} ${B.bg} rounded-xl p-4">
            <div class="flex items-center gap-1.5 mb-3">
              <span class="text-lg">${B.icon}</span>
              <h4 class="font-bold ${B.titleCls} text-sm">${B.title}${B.subj} 유리한 이유</h4>
            </div>
            ${bFactors.length > 0
              ? `<ul class="space-y-3">${bFactors.map(f => renderFactor(f, B.iconCls)).join('')}</ul>`
              : `<p class="text-xs text-slate-400">귀하의 상황에서 ${B.title}${B.subj} 특별히 유리한 요인이 확인되지 않습니다.</p>`}
          </div>
        </div>
        <div class="flex items-start gap-3 ${verdictBgCls} rounded-xl p-4">
          <span class="text-xl shrink-0 mt-0.5">💡</span>
          <div>
            <p class="font-bold ${verdictTitleCls} text-sm mb-1">종합 판단 — ${verdictLabel}</p>
            <p class="text-xs text-slate-600">${verdictText}</p>
          </div>
        </div>
        <p class="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-100">위 분석은 입력값 기반 참고용이며, 최종 선택은 구체적 채무 현황과 전문가 상담을 통해 결정하시기 바랍니다.</p>
      </div>`;
  }

  // ── 파산관재인·예납금 안내 (파산 검토 대상이면 재산 규모와 무관하게 표시) ──
  function buildTrusteeWarning(data, scores) {
    if (scores.bankrupt < 30) return '';
    const totalAssets = data.totalAssets || 0;
    const hasAssets = totalAssets >= 5_000_000;

    return `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-5">
        <div class="flex items-start gap-3 mb-3">
          <span class="text-2xl shrink-0">⚠️</span>
          <div>
            <h3 class="font-bold text-amber-800 text-base mb-1">파산관재인 선임과 예납금 — 미리 준비하세요</h3>
            <p class="text-sm text-slate-600">최근 법원 실무는 재산이 거의 없는 사건에서도 대부분 <strong>파산관재인</strong>을 선임하는 방향입니다. 재산이 매우 적으면 관재인 없이 <em>동시폐지</em>로 종결되는 경우도 있으나 예외적입니다.${hasAssets ? ` 입력하신 재산 합계(<strong>${formatWon(totalAssets)}</strong>)가 있어 관재인이 재산 환가(처분) 절차를 진행할 가능성이 높습니다.` : ''}</p>
          </div>
        </div>

        <div class="space-y-2.5 mb-4">
          <div class="flex gap-2.5 bg-white border border-amber-100 rounded-xl px-4 py-3">
            <span class="text-amber-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">파산관재인 선임 → 예납금 납부 필요</p>
              <p class="text-xs text-slate-500 mt-0.5">법원은 파산관재인 보수 등 절차비용을 위해 <strong>예납명령</strong>을 내립니다. 서울회생법원 기준 원칙 <strong>30만원</strong>이며 사건에 따라 증액될 수 있습니다(법원별로 다를 수 있음). 예납금을 납부하지 못하면 파산신청이 기각될 수 있습니다.</p>
            </div>
          </div>
          <div class="flex gap-2.5 bg-white border border-blue-100 rounded-xl px-4 py-3">
            <span class="text-blue-400 shrink-0 font-bold mt-0.5">i</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">예납금이 부담된다면 — 소송구조 신청 가능</p>
              <p class="text-xs text-slate-500 mt-0.5">소송비용 납부 능력이 없는 경우 법원에 <strong>소송구조</strong>를 신청하면 예납금 납부를 면제·유예받을 수 있습니다. 법원이 직권으로 결정하기도 합니다.</p>
            </div>
          </div>
          <div class="flex gap-2.5 bg-white border border-amber-100 rounded-xl px-4 py-3">
            <span class="text-amber-500 shrink-0 font-bold mt-0.5">!</span>
            <div>
              <p class="text-sm font-semibold text-slate-800">챔로드 서비스 범위 안내</p>
              <p class="text-xs text-slate-500 mt-0.5">챔로드는 서류 준비부터 면책신청까지의 일반 절차를 기준으로 안내합니다. 파산관재인 선임 후의 구체적 대응(면담, 재산 환가 등)은 사건마다 달라, 관재인·법원 안내를 따르고 필요 시 전문가 확인을 권장합니다.</p>
            </div>
          </div>
        </div>

        <div class="bg-amber-100 border border-amber-200 rounded-xl p-4">
          <p class="text-sm font-bold text-amber-800 mb-1">신청 전 전문가 상담을 먼저 받아보세요</p>
          <p class="text-xs text-slate-600">${hasAssets ? '재산이 있는 상황에서의 개인파산은 절차가 더 복잡합니다. ' : ''}<strong>대한법률구조공단(132)</strong>의 무료 상담이나 법무사·변호사 상담을 통해 실제 예납금 규모와 절차를 먼저 확인하세요.</p>
        </div>
      </div>`;
  }

  // ── 소액 채무 안내 (총채무 1,000만원 미만) ──
  // 법으로 정해진 최소 채무액은 없으나, 이 규모에서는 법원 절차(개인회생·파산)의
  // 비용·기간·자격제한 부담이 실익보다 클 수 있어 신용회복위원회 채무조정 등을 우선 안내한다.
  const LOW_DEBT_THRESHOLD = 10_000_000;

  function isLowDebt(data) {
    return (data.totalDebt || 0) < LOW_DEBT_THRESHOLD;
  }

  function buildLowDebtGuidance() {
    return `
      <div class="bg-white rounded-2xl border-2 border-blue-500 shadow-md p-6">
        <div class="flex items-start gap-3">
          <span class="text-2xl shrink-0">💡</span>
          <div>
            <h2 class="text-lg font-bold text-slate-800 mb-2">채무 규모가 크지 않은 편입니다</h2>

    const bestScore = Math.max(scores.rehab, scores.bankrupt);
    if (bestScore < 20) return '';

    const isRehab = scores.rehab >= scores.bankrupt && !hardBlocked.rehab;
    const type    = isRehab ? 'rehab' : 'bankrupt';

      return `

  // scores, hardBlocked는 renderResults() 내에서 이미 계산됨 — 여기서 별도 계산
  (function renderCta() {
    const rawScores  = Storage.load('diagnosis_scores') || { rehab: 0, bankrupt: 0 };
    const data       = Storage.load('diagnosis_data')   || {};
    if (isLowDebt(data)) return; // 소액 채무는 셀프진행 CTA 미표시
    const scores     = applyHardBlocks(rawScores, data);
    const hardBlocked = {
      rehab:    scores.rehab    === 0 && !!getHardBlockReason('rehab',    data),
      bankrupt: scores.bankrupt === 0 && !!getHardBlockReason('bankrupt', data),
    };
    document.getElementById('next-step-cta').innerHTML = buildNextStepCta(scores, hardBlocked);
  })();
