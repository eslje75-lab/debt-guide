<script>
  initPage('resources');

  const FAQS = [
    // ── 제도 이해 ──
    { cat: '제도 이해', q: '개인회생과 개인파산의 차이가 무엇인가요?', a: '개인회생은 정기적인 소득이 있는 채무자가 3~5년간 일부 채무를 변제하고 나머지를 면책받는 절차입니다. 개인파산은 소득과 재산이 없어 변제 자체가 불가능한 채무자가 재산을 정리하고 채무 전부를 면책받는 절차입니다. 소득 유무와 변제 가능성이 핵심 구분 기준입니다.' },
    { cat: '제도 이해', q: '신용회복위원회 절차는 법원 절차와 다른가요?', a: '네, 신용회복위원회는 법원이 아닌 민간 채무조정 기관으로, 금융회사들이 신용회복지원협약을 맺어 운영합니다. 협약에 가입한 금융회사(은행·카드사·캐피탈·저축은행 등)를 대상으로 이자 감면·분할 상환을 조정하는 절차이며, 법원 절차보다 간소합니다. 단, 협약에 가입하지 않은 금융회사나 사채·개인 간 채무는 조정 대상에서 제외될 수 있습니다.' },
    { cat: '제도 이해', q: '개인회생 변제금은 어떻게 계산되나요?', a: '법원은 채무자의 월 가처분소득(소득 - 법원 인정 생계비)을 기준으로 변제금을 산정합니다. 여기에 보유 재산의 청산가치도 고려됩니다. 저희 사이트의 예상 변제금은 단순 참고용이며, 실제 금액은 법원이 소득·재산·부양가족 등을 종합하여 결정합니다.' },

    // ── 자격·비용 ──
    { cat: '자격·비용', q: '빚이 얼마여야 개인회생을 신청할 수 있나요?', a: '최저 채무액 제한은 없습니다. 다만 상한이 있어 담보 있는 채무는 15억원 이하, 담보 없는 채무는 10억원 이하여야 개인회생을 신청할 수 있습니다(채무자회생법 제579조). 이를 초과하면 일반회생 등 다른 절차를 검토해야 합니다. 반대로 채무가 소액이라면 법원 절차의 비용·부담 대비 실익이 크지 않을 수 있어, 신용회복위원회 채무조정을 먼저 검토하는 것도 방법입니다.' },
    { cat: '자격·비용', q: '변호사·법무사 없이 스스로 하면 비용이 얼마나 드나요?', a: '스스로 진행하면 변호사·법무사 수임료 없이 법원에 내는 비용만 듭니다. <strong>개인회생</strong>: 인지대 30,000원(전자소송으로 접수하면 27,000원) + 송달료(1회 5,500원 기준, 채권자 수에 비례해 늘어남 — 접수 시 법원·전자소송에서 자동 계산). 법원이 외부 회생위원을 선임하는 사건은 예납금(통상 15만원)이 추가되지만, 서울회생법원 등 다수 법원은 내부 회생위원이라 예납금이 없는 경우가 많고 영업소득자·고액 채무·최근 취업 등 사안에 따라 부과됩니다. <strong>개인파산</strong>: 인지대는 소액(수천 원)이고, 파산관재인이 선임되면 예납금이 별도로 드는데 서울회생법원 기준 원칙 30만원입니다(사안에 따라 증액 가능). 비용 마련이 어려우면 법원에 <strong>소송구조</strong>를 신청해 인지대·송달료·예납금 납부를 면제·유예받을 수 있습니다. 정확한 금액은 접수 법원 또는 전자소송 화면에서 확인하세요.' },
    { cat: '자격·비용', q: '개인회생 신청 시 변호사나 법무사가 꼭 필요한가요?', a: '법원은 채무자 본인이 직접 신청할 수 있도록 하고 있습니다. 다만 절차가 복잡하므로 스스로 준비하기 어려울 경우 법무사나 변호사 도움을 받을 수 있습니다. 대한법률구조공단에서는 법률구조 요건을 충족하면 무료 지원도 받을 수 있습니다.' },
    { cat: '자격·비용', q: '신청서는 어떻게 접수하나요? (전자소송 vs 방문)', a: '두 가지 방법이 있습니다. ① <strong>전자소송</strong>(ecfs.scourt.go.kr): 회원가입 후 공동인증서(또는 금융인증서)로 로그인해 화면 안내에 따라 신청서·첨부서류를 올리고 인지대·송달료를 온라인으로 결제하면 됩니다. 이후 보정·결정 통지도 온라인으로 받아볼 수 있어 편리하고, 관할 법원도 자동 안내됩니다. ② <strong>방문·우편 접수</strong>: 관할 법원(지방법원 본원·회생법원) 접수창구에 서류를 직접 내거나 우편으로 보냅니다. 어느 방법이든 접수하면 사건번호가 부여되며, 이후 진행 상황은 "대법원 나의사건검색"에서 확인할 수 있습니다.' },
    { cat: '자격·비용', q: '한 번 면책을 받으면 다시는 못 받나요?', a: '재신청이 제한되는 기간이 있습니다. 개인파산은 면책을 받은 후 7년이 지나지 않으면 다시 면책받기 어렵고(채무자회생법 제564조제1항제4호), 개인회생은 신청 전 5년 이내에 파산·개인회생으로 면책받은 사실이 있으면 기각 사유가 됩니다(제595조제5호). 과거에 면책받은 이력이 있다면 그 시점부터 얼마나 지났는지 먼저 확인하세요.' },
    { cat: '자격·비용', q: '채무 발생 원인이 도박인 경우 파산 면책이 안 되나요?', a: '도박·낭비·사치로 채무가 발생한 경우 면책불허가 사유에 해당합니다. 다만 법원은 재량으로 면책을 허가할 수 있으며, 도박 이후 장기간 성실하게 변제 노력을 한 경우 등이 참작될 수 있습니다. 이 경우 반드시 전문가 상담을 먼저 받으세요.' },

    // ── 진행 중 생활·상황 ──
    { cat: '진행 중 생활·상황', q: '신청 사실이 회사나 가족에게 알려지나요? 등본에 기록이 남나요?', a: '법원이 신청 사실을 직장(회사)에 직접 통지하지는 않습니다. 또한 개인회생·파산 신청이나 결정 사실은 <strong>주민등록등본·가족관계증명서에 기재되지 않습니다</strong>(이 서류들은 신원 확인용으로 제출하는 것일 뿐입니다). 다만 ① 이미 급여·통장 압류가 걸려 있으면 회사가 그 사실을 알 수 있고, ② 법원에서 오는 우편물(보정·결정 통지 등)은 주민등록상 주소로 발송되므로 우편함 관리가 필요합니다. 면책이 확정되면 그 정보가 한국신용정보원에 일정 기간(파산 면책은 통상 7년) 등록되지만, 이는 개인 신용정보이지 회사에 통지되는 것은 아닙니다.' },
    { cat: '진행 중 생활·상황', q: '급여·통장이 압류됐는데 어떻게 생활하나요?', a: '두 갈래로 대응합니다. ① <strong>개인회생</strong>은 신청과 동시에 중지·금지명령을 함께 신청하면 법원이 명령을 내려 압류·강제집행을 멈출 수 있고(채무자회생법 제593조), 개시결정이 나면 자동으로 중지되며 인가결정 시 효력을 잃습니다(제600조). <strong>개인파산</strong>도 파산선고 시 강제집행의 효력이 사라집니다. ② 명령이 나오기 전이라도 급여는 법으로 일정 부분이 보호됩니다 — 급여의 2분의 1(그 절반이 월 250만원에 못 미치면 250만원까지)은 압류할 수 없습니다(민사집행법 제246조, 2026년 2월 시행 시행령 기준). 다만 급여가 많은 경우(대략 월 600만원 초과)에는 압류금지 금액에 상한이 있어 실제 보호되는 금액이 절반보다 적을 수 있습니다. 그런데도 통장이 묶여 생활이 어려우면 법원에 <strong>압류금지채권 범위변경 신청</strong>을 해서 실제 생계에 필요한 금액을 확보할 수 있습니다(소득·부양가족·주거비·의료비 지출 자료를 함께 제출). 이 조치는 시간이 걸리므로, 압류가 걸린 상태라면 개인회생·파산 신청을 서두르는 것이 좋습니다.' },
    { cat: '진행 중 생활·상황', q: '진행 중에 이사를 가도 되나요?', a: '이사 자체를 금지하지는 않습니다. 다만 주민등록상 주소가 바뀌면 법원 우편(송달)이 제대로 오지 않아 절차가 지연되거나 불이익을 받을 수 있으므로, 이사하면 전입신고를 하고 전자소송으로 접수한 경우 주소 정보를 갱신하며, 필요하면 법원에 주소 변경을 알리세요. 관할은 신청 당시 주소지 기준으로 유지되는 것이 원칙입니다.' },
    { cat: '진행 중 생활·상황', q: '진행 중에 해외여행이나 장기 출장을 가도 되나요?', a: '해외여행 자체를 금지하는 규정은 없습니다. 다만 개인파산은 파산관재인 면담·심문기일 등 반드시 출석·협조해야 하는 일정이 있고, 정당한 사유 없이 법원의 출석 요구에 응하지 않으면 면책불허가 사유가 될 수 있으므로(채무자회생법 제319조 관련), 예정된 기일과 겹치지 않게 일정을 조율하고 필요하면 법원에 미리 알리세요. 개인회생은 매달 변제금 납입만 유지하면 여행에 별도 제약은 없습니다.' },
    { cat: '진행 중 생활·상황', q: '진행 중에 이직하거나 사업자등록을 해도 되나요?', a: '개인회생은 오히려 안정적인 소득이 있어야 유리하므로 이직·취업은 문제되지 않습니다. 다만 소득이 크게 바뀌면 변제금이 달라질 수 있으니 변동을 회생위원·법원에 알리세요(변제계획 변경이 필요할 수 있음). 개인파산은 파산선고~면책 확정 사이에 일부 자격·직업이 제한될 수 있으니(아래 "못 하게 되는 직업" 항목 참고), 자격이 필요한 업종으로 이직·창업하려면 먼저 확인하세요.' },
    { cat: '진행 중 생활·상황', q: '개인파산을 하면 못 하게 되는 직업이 있나요?', a: '파산선고를 받고 아직 면책이 확정되지 않은 기간에는 일부 자격·직업이 제한됩니다. 변호사·공인회계사·세무사·법무사·공인중개사·보험설계사·경비원 등 개별 법률이 자격 요건으로 "파산선고를 받지 않을 것"을 정한 직종이 대표적입니다. 반면 일반 회사원은 파산만으로 해고되지 않는 것이 원칙이고, 일반 공무원도 국가공무원법·지방공무원법이 파산을 결격사유로 두고 있지 않다는 것이 일반적 해석입니다(개별 직렬·법령에 따라 다를 수 있으니 본인 직업의 근거법을 확인하세요). 이 제한은 한시적이어서 면책이 확정되면 별도 신청 없이 복권되어 자격 제한이 사라집니다(채무자회생법 제574조).' },
    { cat: '진행 중 생활·상황', q: '진행 중에 상속·보험금 등으로 재산이 생기면 어떻게 하나요?', a: '진행 중 새로 재산이 생기면 반드시 법원·회생위원(파산은 관재인)에 알려야 합니다. 개인회생은 재산이 늘면 청산가치가 올라가 변제금이 상향될 수 있고, 개인파산은 시기에 따라 파산재단에 포함될 수 있습니다. 숨기면 재산 은닉으로 면책불허가·파산취소 사유가 되니, 예상치 못한 재산이 생기면 먼저 신고하고 처리 방법을 안내받으세요.' },
    { cat: '진행 중 생활·상황', q: '개인회생 신청 후 변제기간 동안 어떤 제한이 있나요?', a: '변제기간 중에는 법원의 허가 없이 고액 재산 처분, 신규 차입 등이 제한됩니다. 신용카드 신규 발급 및 사용도 사실상 불가능합니다. 매월 변제금을 회생위원 임치계좌에 입금해야 하며, 소득이 크게 증가한 경우 변제금이 증가할 수 있습니다. 변제 기간 동안 성실히 이행해야 면책이 가능합니다.' },

    // ── 결과·이후 ──
    { cat: '결과·이후', q: '신청이 기각되면 어떻게 되나요?', a: '두 단계로 대응합니다. ① 기각 결정을 받으면 재판 고지일부터 <strong>1주일(불변기간)</strong> 이내에 서면으로 즉시항고를 할 수 있습니다 — 이 기간을 놓치면 결정이 확정되므로 결정문을 받는 즉시 판단해야 합니다. 즉시항고를 하면 원래 신청일과 시효중단 효과가 유지되고, 1심에서 못 낸 보정자료도 항고심에서 제출할 수 있습니다. ② 항고 기간이 지났거나 보완이 어려우면 부족한 부분을 갖춰 재신청할 수 있습니다. 소득이 전혀 없어 개인회생이 어려운 경우라면 개인파산으로 방향을 바꾸는 것도 방법입니다.' },
    { cat: '결과·이후', q: '개인파산 후 면책불허가가 되면 어떻게 되나요?', a: '면책불허가 결정이 나면 채무는 소멸되지 않습니다. 다만 법원에 즉시항고가 가능하며, 면책불허가 이후에도 개인회생 신청 등 다른 방법을 검토할 수 있습니다. 면책불허가 사유에 해당하는지 사전에 반드시 확인하세요.' },
    { cat: '결과·이후', q: '개인파산 후 재산은 어떻게 되나요?', a: '파산선고 시 일정 한도 이상의 재산은 파산재단에 편입되어 채권자에게 배당됩니다. 다만 압류금지재산(생계에 필수적인 의류·가구, 월 250만원 이하의 급여채권 등 — 2026년 2월 시행 민사집행법 시행령 기준)과 퇴직금 중 압류금지 부분은 보호되며, 파산선고 이후 새로 얻는 소득은 원칙적으로 파산재단에 포함되지 않습니다. 처분할 재산이 없으면 배당 절차 없이 동시폐지로 진행됩니다.' },
    { cat: '결과·이후', q: '면책을 받으면 모든 빚이 없어지나요?', a: '아닙니다. 면책을 받아도 없어지지 않는 빚(비면책채권)이 있습니다. 세금, 벌금·과료·과태료·형사소송비용, 고의로 저지른 불법행위에 따른 손해배상, 양육비·부양료 등은 면책 대상에서 제외됩니다(채무자회생법 제566조·제625조). 또한 개인회생은 채권자목록에 기재하지 않은 채무가, 개인파산은 알면서도 고의로 채권자목록에서 뺀 채무가 면책되지 않으므로, 신청 시 채권자목록을 빠짐없이 작성하는 것이 매우 중요합니다.' },
    { cat: '결과·이후', q: '개인회생·파산을 하면 가족이나 보증인에게 피해가 가나요?', a: '면책은 신청한 본인의 채무에만 효력이 있습니다. 배우자 등 가족 명의의 재산은 원칙적으로 절차와 무관하며, 내 채무가 가족에게 넘어가지도 않습니다. 다만 내 채무에 보증인이 있는 경우, 내가 면책을 받아도 보증인의 변제 의무는 그대로 남습니다(채무자회생법 제567조·제625조). 채권자가 보증인에게 청구할 수 있으므로, 가족·지인이 보증을 선 채무가 있다면 신청 전에 반드시 상황을 공유하고 전문가와 상의하세요.' },
    { cat: '결과·이후', q: '절차가 끝나면 신용은 언제 회복되나요? 카드·대출은 언제부터 되나요?', a: '면책·완제 후 한국신용정보원 등에 등록됐던 정보가 해제되면서 신용거래가 다시 가능해집니다. 개인회생은 변제를 마치고 면책되면 관련 정보가 정리되며, 인가 후 1년 이상 성실히 변제하면 공공정보가 조기 삭제될 수 있습니다(2025년 제도 개선). 개인파산은 면책결정 정보가 통상 5년 경과 후 삭제됩니다. 다만 기록이 해제되어도 각 금융회사의 자체 심사 기준에 따라 카드 발급·대출 시점은 달라지므로, 소액·성실 거래로 신용을 다시 쌓아가는 것이 현실적입니다. 정확한 등록·해제 여부는 신용조회(크레딧포유 등)로 직접 확인하세요.' },
  ];

  function renderFAQ() {
    const cats = [];
    FAQS.forEach(f => { if (!cats.includes(f.cat)) cats.push(f.cat); });
    let idx = 0;
    const html = cats.map(cat => {
      const items = FAQS.map((f, i) => ({ f, i })).filter(o => o.f.cat === cat);
      const cards = items.map(({ f, i }) => `
        <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden mb-3">
          <button onclick="toggleFaq(${i})" class="w-full flex items-center justify-between p-5 text-left hover:bg-slate-50 transition-colors">
            <span class="font-semibold text-slate-800 text-sm pr-4">Q. ${f.q}</span>
            <span id="faq-icon-${i}" class="faq-icon text-slate-400 text-xl shrink-0">+</span>
          </button>
          <div id="faq-ans-${i}" class="faq-answer px-5 pb-5">
            <div class="bg-blue-50 rounded-xl p-4 text-sm text-slate-700 leading-relaxed border-l-4 border-blue-200 flex gap-2">
              <span class="font-semibold shrink-0">A.</span><span>${f.a}</span>
            </div>
          </div>
        </div>`).join('');
      return `
        <div class="mb-6">
          <h2 class="text-sm font-bold text-slate-500 mb-3 px-1">${cat}</h2>
          ${cards}
        </div>`;
    }).join('');
    document.getElementById('resource-content').innerHTML = html;
  }

  function toggleFaq(i) {
    const ans = document.getElementById('faq-ans-' + i);
    const icon = document.getElementById('faq-icon-' + i);
    ans.classList.toggle('open');
    icon.classList.toggle('open');
    icon.textContent = ans.classList.contains('open') ? '−' : '+';
  }

  renderFAQ();
</script>
</body>
</html>
