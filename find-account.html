<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 | 챔로드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#533afd">
  <style>
    .input-field {
      width: 100%; padding: 0.625rem 0.875rem; border: 1.5px solid #e2e8f0;
      border-radius: 0.625rem; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .input-field.error { border-color: #ef4444; }
    .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem; display: none; }
    .error-msg.show { display: block; }
    .btn-primary {
      width: 100%; padding: 0.75rem; background: #1d4ed8; color: white;
      border-radius: 0.625rem; font-weight: 600; font-size: 0.95rem;
      transition: background 0.2s; cursor: pointer; border: none;
    }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert-box { padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .alert-box.show { display: block; }
    .alert-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- 상단 로고 -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#533afd">
          <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none">
            <path d="M2 18L10 5L18 18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="10" y1="8.5" x2="10" y2="11.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="10" y1="14" x2="10" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="font-bold text-slate-800 text-lg tracking-tight">챔로드</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800 mb-1">비밀번호 재설정</h1>
        <p class="text-slate-500 text-sm">가입하신 이메일로 재설정 링크를 보내드립니다</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">

        <!-- ── 입력 폼 ── -->
        <div id="form-panel">
          <div id="fa-alert" class="alert-box alert-error"></div>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">가입 이메일</label>
              <input id="fa-email" type="email" class="input-field" placeholder="example@email.com" autocomplete="email">
              <p id="fa-email-err" class="error-msg">올바른 이메일을 입력해주세요.</p>
            </div>

            <button class="btn-primary" id="fa-submit" onclick="doRequest()">재설정 메일 보내기</button>

            <p class="text-xs text-slate-400 leading-relaxed">
              계정 도용을 막기 위해, 이름만으로는 재설정하지 않고 <strong class="text-slate-500">가입 이메일 본인 인증</strong>을 거칩니다.
              메일이 안 보이면 스팸함도 확인해주세요.
            </p>
          </div>
        </div>

        <!-- ── 발송 완료 상태 ── -->
        <div id="done-panel" class="hidden text-center py-2">
          <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-7 h-7 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <p class="text-base font-semibold text-slate-800 mb-2">메일을 보냈습니다</p>
          <p class="text-sm text-slate-500 leading-relaxed mb-1">
            입력하신 주소로 <strong class="text-slate-700">가입된 계정이 있으면</strong> 재설정 링크를 보냈습니다.
            메일함(및 스팸함)을 확인하고 <strong class="text-slate-700">30분 안에</strong> 링크를 눌러주세요.
          </p>
          <p class="text-xs text-slate-400">메일이 오지 않으면 가입한 이메일이 맞는지 확인해주세요.</p>
        </div>

        <div class="border-t border-slate-100 mt-5 pt-5 text-center">
          <a href="login.html" class="text-sm text-blue-700 hover:underline">← 로그인 화면으로</a>
        </div>
      </div>

      <p class="text-center text-xs text-slate-400 mt-4">
        문의: <a href="mailto:eslje75@gmail.com" class="hover:underline">eslje75@gmail.com</a>
      </p>
    </div>
  </main>

<script src="js/main.js"></script>
<script>
  let _busy = false;

  function showErr(msg) {
    const el = document.getElementById('fa-alert');
    el.textContent = msg; el.classList.add('show');
  }

  async function doRequest() {
    const email = document.getElementById('fa-email').value.trim();
    document.getElementById('fa-alert').classList.remove('show');
    const errEl = document.getElementById('fa-email-err');
    const field = document.getElementById('fa-email');

    if (!email || !email.includes('@') || !email.includes('.')) {
      field.classList.add('error'); errEl.classList.add('show'); field.focus(); return;
    }
    field.classList.remove('error'); errEl.classList.remove('show');
    if (_busy) return;

    _busy = true;
    const btn = document.getElementById('fa-submit');
    btn.disabled = true; btn.textContent = '보내는 중...';
    const r = await Auth.requestReset(email);
    _busy = false;
    btn.disabled = false; btn.textContent = '재설정 메일 보내기';

    if (!r.ok) { showErr(r.error || '요청을 처리하지 못했습니다. 잠시 후 다시 시도해주세요.'); return; }

    // 서버는 계정 존재 여부와 무관하게 항상 성공(열거 방지) — 발송 완료 화면으로 전환
    document.getElementById('form-panel').classList.add('hidden');
    document.getElementById('done-panel').classList.remove('hidden');
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doRequest(); });
</script>
</body>
</html>
