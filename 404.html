<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 | 챔로드</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#533afd">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, 'Malgun Gothic', sans-serif;
      background: #f6f9fc; color: #1a1f36;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 420px; }
    .mark {
      width: 56px; height: 56px; border-radius: 14px; background: #533afd;
      display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px;
    }
    .code { font-size: 64px; font-weight: 800; color: #533afd; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: #697386; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block; background: #533afd; color: #fff; text-decoration: none;
      padding: 12px 28px; border-radius: 9999px; font-size: 14px; font-weight: 600;
    }
    .btn:hover { background: #4429e0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 18L10 5L18 18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="10" y1="8.5" x2="10" y2="11.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="14" x2="10" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 주소가 변경되었거나 존재하지 않습니다.<br>아래 버튼으로 홈으로 이동해 주세요.</p>
    <a class="btn" href="/index.html">홈으로 돌아가기</a>
  </div>
</body>
</html>
